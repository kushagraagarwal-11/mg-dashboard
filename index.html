<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1"><title>MG Program — Funnel Cuts</title>
<style>
:root{--bg:#F1EDF7;--card:#FAF9FC;--ink:#161021;--sub:#665E75;--faint:#8C8699;--line:#E6E1EE;--line2:#EFEBF5;
--brand:#D9008D;--blue:#2563EB;--pos:#06874E;--neg:#D92D20;--warm:#B45309}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);
-webkit-font-smoothing:antialiased;padding:26px 22px 60px;max-width:1220px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:6px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);margin-bottom:5px}
h1{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.asof{font-size:12.5px;color:var(--sub);text-align:right;line-height:1.7;padding-top:4px}
.asof b{color:var(--ink);font-weight:700}
.winnote{font-size:12px;color:var(--sub);margin:2px 0 16px;font-weight:600}
.winnote b{color:var(--brand)}
.tabs{display:inline-flex;gap:2px;background:#E5DFEE;padding:3px;border-radius:12px;margin-bottom:18px;flex-wrap:wrap}
.tab{border:none;background:transparent;color:var(--sub);border-radius:9px;padding:8px 16px;font-size:13.5px;font-weight:650;cursor:pointer;transition:.12s;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(22,16,33,.14),0 0 0 .5px rgba(22,16,33,.04)}
.card{background:var(--card);border:1px solid #EAE5F1;border-radius:16px;box-shadow:0 4px 24px rgba(22,16,33,.06);padding:18px 20px;margin-bottom:14px;position:relative}
.ch2{font-size:15px;font-weight:750;letter-spacing:-.01em}
.ch2 .chip{font-size:10.5px;font-weight:800;background:#F6E0EE;color:var(--brand);border-radius:6px;padding:2px 8px;margin-left:8px;vertical-align:2px}
.csub{font-size:12.5px;color:var(--sub);margin-top:2px;margin-bottom:12px}.csub b{color:var(--ink)}
.note{font-size:11.5px;color:var(--sub);margin-top:12px;line-height:1.6;padding-top:11px;border-top:1px solid var(--line2)}
/* stair-step funnel: descending bars + dashed PRE tick (bullet style) */
.fun{width:100%}
.fun .row{display:grid;grid-template-columns:150px 1fr 168px;align-items:center;gap:12px;margin:9px 0}
.fun.mini .row{grid-template-columns:108px 1fr 128px;margin:7px 0;gap:8px}
.fun .nm{font-size:12.5px;font-weight:700;color:#4A4258;text-align:right;line-height:1.25}
.fun.mini .nm{font-size:10.5px}
.fun .nm .mb{color:var(--brand);font-weight:800}
.fun .bz{position:relative;height:27px}
.fun.mini .bz{height:19px}
.fun .b{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);border-radius:6px;background:var(--brand)}
.fun .pk{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);border:2px dashed #3A3348;border-radius:6px;opacity:.6}
.fun .val{white-space:nowrap}
.fun .val .p2{font-size:16.5px;font-weight:800;letter-spacing:-.02em}
.fun .val .ab{font-size:11px;color:var(--faint);font-weight:700;margin-left:4px}
.fun .val .pr{font-size:11px;color:#948DA5;font-weight:700}
.fun.mini .val .p2{font-size:13.5px}
.fun.mini .val .ab{font-size:10px}
.fun.mini .val .pr{font-size:10px}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--sub);font-weight:650;margin-top:8px}
.legend .k1{display:inline-block;width:14px;height:9px;background:var(--brand);border-radius:2px;margin-right:5px}
.legend .k2{display:inline-block;width:16px;height:10px;border:2px dashed #3A3348;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* metric table */
table.t{border-collapse:collapse;width:100%}
.t thead th{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);text-align:right;padding:0 10px 8px;border-bottom:1px solid var(--line)}
.t thead th.l{text-align:left}
.t td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:right;vertical-align:middle;font-variant-numeric:tabular-nums}
.t tr:last-child td{border-bottom:none}
.t td.l{text-align:left;font-size:12.5px;color:#4A4258;font-weight:600}
.t td.l .mb{color:var(--brand);font-weight:800}
.t td.l .of{color:var(--faint);font-weight:600;font-size:11px}
.t td .p{font-size:16px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.t td .a{font-size:11px;color:var(--faint);font-weight:600;margin-left:4px}
.t td.pre .p{color:#948DA5;font-size:14.5px}
.dl{font-size:11.5px;font-weight:750;display:inline-flex;align-items:center;gap:2px}.up{color:var(--pos)}.dn{color:var(--neg)}.fl{color:var(--faint)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(345px,1fr));gap:14px}
.grid .card{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2 .card{margin-bottom:0}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.cuthdr{display:flex;align-items:baseline;gap:8px;margin-bottom:2px;flex-wrap:wrap}
.cuthdr .nm{font-size:15px;font-weight:800}
.cuthdr .n{font-size:12px;color:var(--faint);font-weight:700}
.tatline{font-size:11.5px;color:var(--sub);font-weight:650;margin-top:9px;padding-top:8px;border-top:1px solid var(--line2)}
.tatline b{color:#4A4258}
/* cohort matrix: cohorts as column groups (PRE|POST), metrics as rows, mini funnel in header */
table.mx{border-collapse:collapse;width:100%}
.mx th{font-size:11px;font-weight:800;color:var(--faint);text-align:center;padding:6px 8px;border-bottom:1px solid var(--line)}
.mx th.l{text-align:left;position:sticky;left:0;background:var(--card);z-index:4;border-right:1px solid var(--line)}
.mx th.gh{color:var(--ink);font-size:14px;border-left:1px solid var(--line2);vertical-align:bottom;min-width:255px}
.mx th.gh .gn{font-size:10.5px;color:var(--faint);font-weight:700;margin-top:2px}
.mx td{padding:10px 12px;border-bottom:1px solid var(--line2);text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.mx tr:last-child td{border-bottom:none}
.mx td.l{text-align:left;font-size:13px;color:#4A4258;font-weight:650;white-space:nowrap;padding-right:18px;position:sticky;left:0;background:var(--card);z-index:3;border-right:1px solid var(--line)}
.mx td.l .mb{color:var(--brand);font-weight:800}
.mx td.l .of{color:var(--faint);font-weight:600;font-size:10.5px}
.mx td.prc{color:#948DA5;font-weight:700;font-size:13px;border-left:1px solid var(--line2)}
.mx td.poc{font-weight:800;font-size:14.5px}
.mx td .a{font-size:10px;color:var(--faint);font-weight:700;margin-left:3px}
.mf{display:flex;flex-direction:column;align-items:center;gap:4px;margin:0 auto 9px;width:235px}
.mf .r{position:relative;height:14px;width:100%}
.mf .b2{position:absolute;left:50%;transform:translateX(-50%);top:0;bottom:0;background:var(--brand);border-radius:4px}
.mf .o2{position:absolute;left:50%;transform:translateX(-50%);top:0;bottom:0;border:1.5px dashed #3A3348;border-radius:3px;opacity:.55}
.mx .cw{display:inline-flex;align-items:center}
.mx .stk{display:inline-flex;flex-direction:column;align-items:flex-start;margin-left:4px;line-height:1.2;text-align:left}
.mx .stk .dl{font-size:9.5px}
.mx .stk .sb{font-size:10px;color:var(--faint);font-weight:700}
.mx .pa{font-size:13px;color:#948DA5;font-weight:700}
.mx td.poc .pa{font-size:15px;color:var(--ink);font-weight:800}
.mx .pp2{font-size:11px;color:var(--faint);font-weight:700;margin-top:1px}
/* heatmap + modal */
table.hm{border-collapse:collapse;font-size:12px;width:100%}
.hm th{color:var(--sub);font-weight:650;padding:4px 5px;text-align:center;font-size:10.5px}.hm th.hr{text-align:right}
.hm td{text-align:center;font-weight:700;padding:4px 3px;color:#3A3348;font-variant-numeric:tabular-nums;min-width:26px;border-bottom:.5px solid #DDD8E5}
.hm td.hr{color:var(--faint);text-align:right;padding-right:9px;font-weight:600;white-space:nowrap}
.hm td.tot,.hm th.tot{font-weight:800;color:var(--ink)}.hm tr.totr td{border-top:1px solid var(--line);padding-top:6px}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto}
.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:600}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:12px;height:12px;border-radius:3px;display:inline-block}
.hide{display:none}.err{color:var(--neg);font-weight:600;padding:22px}
.warm{color:var(--warm);font-weight:700}
</style></head><body>
<div class=top><div><div class=eyebrow>WIOM · Minimum Guarantee Program</div><h1>Booking → Install · Funnel Cuts</h1></div>
<div class=asof id=asof>loading…</div></div>
<div class=winnote id=winnote></div>
<div class=tabs>
 <button class="tab on" data-t=t1>① Overview</button>
 <button class=tab data-t=t2>② Feedback cohorts</button>
 <button class=tab data-t=t3>③ Banner campaigns</button>
 <button class=tab data-t=t4>④ DoD · Hour-of-day</button>
</div>
<div id=t1></div><div id=t2 class=hide></div><div id=t3 class=hide></div><div id=t4 class=hide></div>
<script>
var API='https://web-production-9f444.up.railway.app/data4';
function n(v){return v==null?'—':Number(v).toLocaleString('en-IN');}
function ft(m){if(m==null)return '—';return m<90?Math.round(m)+'m':(m/60).toFixed(1)+'h';}
var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fd(d){var a=d.split('-');return (+a[2])+' '+MO[+a[1]-1];}
function dl(pre,post,good){if(pre==null||post==null||!pre)return '<span class="dl fl">—</span>';
 var pc=Math.round((post-pre)/Math.abs(pre)*100);if(pc===0)return '<span class="dl fl">0%</span>';
 var up=good==='up'?pc>0:pc<0;return '<span class="dl '+(up?'up':'dn')+'">'+(pc>0?'▲':'▼')+Math.abs(pc)+'%</span>';}
function pct(a,b){return b?Math.round(100*a/b):null;}

/* every stage % is OF BOOKINGS RECEIVED (manager spec) */
var STAGES=[
 {k:'received',nm:'Bookings'},
 {k:'slot',nm:'Slot proposed <span class=mb>MBG</span>'},
 {k:'confirm',nm:'Cx confirmed'},
 {k:'assign',nm:'Tech assigned <span class=mb>MBG</span>'},
 {k:'install',nm:'Installed'}];
var METRICS=[
 {k:'recv_d', lab:'Bookings <span class=of>/ day (grey = total)</span>', fmt:function(v){return v==null?'—':v;}, good:'up', abs:'received'},
 {k:'slot_pct', lab:'Slot proposed % <span class=mb>MBG</span>', fmt:function(v){return v==null?'—':v+'%';}, good:'up', abs:'slot'},
 {k:'confirm_pct', lab:'Cx confirmed %', fmt:function(v){return v==null?'—':v+'%';}, good:'up', abs:'confirm'},
 {k:'assign_pct', lab:'Tech assigned % <span class=mb>MBG</span>', fmt:function(v){return v==null?'—':v+'%';}, good:'up', abs:'assign'},
 {k:'install_pct', lab:'Installed %', fmt:function(v){return v==null?'—':v+'%';}, good:'up', abs:'install'},
 {k:'tat_ta', lab:'TAT accept', fmt:ft, good:'down', tat:1},
 {k:'tat_ca', lab:'TAT confirm→assign', fmt:ft, good:'down', tat:1},
 {k:'tat_ai', lab:'TAT assign→install', fmt:ft, good:'down', tat:1}];
function prep(blk,fixedDays){ // recv_d + ALL stage %s rebased on received
 if(!blk)return blk;
 ['PRE','POST'].forEach(function(p){var m=blk[p];if(!m)return;
  if(m.csp_days&&m.csps)m.recv_d=Math.round(m.received*m.csps/m.csp_days);
  else if(fixedDays)m.recv_d=Math.round(m.received/fixedDays);
  m.slot_pct=pct(m.slot,m.received);m.confirm_pct=pct(m.confirm,m.received);
  m.assign_pct=pct(m.assign,m.received);m.install_pct=pct(m.install,m.received);});
 return blk;
}

/* ---- TRIANGLE funnel: POST = filled shape, PRE = dotted outline (manager sketch) ---- */
function funnel(P,Q,mini){
 var qr=Q?Q.received:0,pr=P?P.received:0;
 var s='<div class="fun'+(mini?' mini':'')+'">';
 STAGES.forEach(function(st,i){
  var qv=Q?(Q[st.k]||0):0,pv=P?(P[st.k]||0):0;
  var qp,pp;
  if(i===0){var base=Math.max(qr,pr)||1;qp=100*qv/base;pp=100*pv/base;}
  else{qp=qr?100*qv/qr:0;pp=pr?100*pv/pr:0;}
  if(P){var gap=2.5,d0=pp-qp;                       // keep the dashed outline visibly apart from the bar edge
   if(Math.abs(d0)<gap)pp=(d0>=0)?qp+gap:Math.max(2,qp-gap);}
  var big=(i===0)?n(qv):(qr?Math.round(qp)+'%':'—');
  var ab=(i===0)?'bookings':n(qv);
  var pre=(i===0)?('pre '+n(pv)):(pr?('pre '+Math.round(pp)+'% '+n(pv)):'pre —');
  var dv=(i===0)?dl(pv,qv,'up'):((pr&&qr)?dl(pp,qp,'up'):'<span class="dl fl">—</span>');
  s+='<div class=row><span class=nm>'+st.nm+'</span>'+
   '<span class=bz><span class=b style="width:'+Math.max(1.5,qp)+'%"></span>'+
   (P?'<span class=pk style="width:'+Math.max(2,Math.min(100,pp))+'%"></span>':'')+'</span>'+
   '<span class=val><span class=p2>'+big+'</span><span class=ab>'+ab+'</span> '+dv+'<div class=pr>'+pre+'</div></span></div>';});
 s+='<div class=legend><span><span class=k1></span>POST bar</span><span><span class=k2></span>PRE (dashed outline)</span><span>all % = share of bookings received</span></div></div>';
 return s;
}
function tatline(P,Q){
 function pair(k){return ft(P?P[k]:null)+' → <b>'+ft(Q?Q[k]:null)+'</b>';}
 return '<div class=tatline>TATs (pre → post): task→accept '+pair('tat_ta')+' · confirm→assign '+pair('tat_ca')+' · assign→install '+pair('tat_ai')+'</div>';
}
function funnelCard(title,sub,blk,mini,extraNote){
 var P=blk?blk.PRE:null,Q=blk?blk.POST:null;
 return '<div class=card><div class=cuthdr><span class=nm>'+title+'</span><span class=n>'+sub+'</span></div>'+
  funnel(P,Q,mini)+tatline(P,Q)+(extraNote||'')+'</div>';
}

/* ---- grouped bars: bookings + installs per day ---- */
function barsChart(daily,launch){
 var W=1100,H=300,padL=46,padR=16,padT=24,padB=30,iw=W-padL-padR,ih=H-padT-padB;
 var mx=1;daily.forEach(function(x){if(x.b>mx)mx=x.b;if(x.i>mx)mx=x.i;});mx*=1.12;
 var gw=iw/daily.length,bw=Math.min(34,gw*.55);
 var s='';var g='';
 for(var k=0;k<=4;k++){var gv=Math.round(mx*k/4),gy=padT+ih-(k/4)*ih;
  g+='<line x1='+padL+' y1='+gy.toFixed(1)+' x2='+(W-padR)+' y2='+gy.toFixed(1)+' stroke="#EFEBF5"/>'+
     '<text x='+(padL-8)+' y='+(gy+3.5).toFixed(1)+' text-anchor=end fill="#8C8699" font-size=10.5>'+n(gv)+'</text>';}
 var step=Math.max(1,Math.ceil(daily.length/14));
 daily.forEach(function(x,i){
  var cx=padL+(i+.5)*gw;
  var hb=ih*x.b/mx,hi=ih*x.i/mx;
  s+='<rect x='+(cx-bw/2).toFixed(1)+' y='+(padT+ih-hb).toFixed(1)+' width='+bw+' height='+hb.toFixed(1)+' rx=3 fill="#BCD0F9"/>';
  s+='<rect x='+(cx-bw/2).toFixed(1)+' y='+(padT+ih-hi).toFixed(1)+' width='+bw+' height='+hi.toFixed(1)+' rx=3 fill="#D9008D"/>';
  s+='<text x='+cx.toFixed(1)+' y='+(padT+ih-hb-5).toFixed(1)+' text-anchor=middle fill="#2563EB" font-size=10.5 font-weight=800>'+x.b+'</text>';
  var yi=padT+ih-hi;
  if(hb-hi<15){s+='<text x='+cx.toFixed(1)+' y='+(yi+13).toFixed(1)+' text-anchor=middle fill="#fff" font-size=10 font-weight=800>'+x.i+'</text>';}
  else{s+='<text x='+cx.toFixed(1)+' y='+(yi-4).toFixed(1)+' text-anchor=middle fill="#D9008D" font-size=10 font-weight=800>'+x.i+'</text>';}
  if(i%step===0||i===daily.length-1)s+='<text x='+cx.toFixed(1)+' y='+(H-8)+' text-anchor=middle fill="#8C8699" font-size=10.5>'+fd(x.d)+'</text>';
  if(launch&&x.d===launch)s+='<line x1='+(cx-gw/2).toFixed(1)+' y1='+padT+' x2='+(cx-gw/2).toFixed(1)+' y2='+(padT+ih)+' stroke="#D9008D" stroke-width=1.5 stroke-dasharray="4 4" opacity=".55"/><text x='+(cx-gw/2+5).toFixed(1)+' y='+(padT+11)+' fill="#D9008D" font-size=10.5 font-weight=800>MG launch</text>';});
 return '<div class=lgd><span><i style="background:#BCD0F9"></i>Bookings received</span><span><i style="background:#D9008D"></i>Installs (event day, inside the same bar)</span></div>'+
  '<div class=chart><svg viewBox="0 0 '+W+' '+H+'">'+g+s+'</svg></div>';
}

function heatmap(cells,title,sub,drill){
 if(!cells||!cells.length)return '<div class=card><div class=ch2>'+title+'</div><div class=csub>no data yet</div></div>';
 var WD=['#FDECEC','#E8F0FE','#FDE8F3','#E7F6EC','#FFF4E0','#F1E8FD','#E6F7F8'];   // Sun..Sat
 var WDN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
 var days=Array.from(new Set(cells.map(function(x){return x.d;}))).sort(),key={},tot=0;
 cells.forEach(function(x){key[x.hr+'|'+x.d]=(key[x.hr+'|'+x.d]||0)+x.n;tot+=x.n;});
 var NIGHT=[23,0,1,2,3,4,5,6,7],hours=['night'];
 for(var h=8;h<=22;h++)hours.push(h);
 var t0=new Date();t0=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate()).getTime();
 function meta(d){var dt=new Date(d+'T00:00:00');return {di:Math.round((t0-dt.getTime())/86400000),wd:dt.getDay()};}
 var dt2={};days.forEach(function(d){dt2[d]=0;});
 var s='<div class=card><div class=ch2>'+title+'</div><div class=csub><b>'+n(tot)+'</b> total · '+sub+' · columns tinted by weekday — same colour = same weekday (compare D-1 with D-8)'+(drill?' · <b>click a cell for the lead journeys</b>':'')+'</div><div style="overflow-x:auto"><table class=hm><thead><tr><th class=hr>Hour</th>'+
   days.map(function(d){var m=meta(d);return '<th style="background:'+WD[m.wd]+'">D-'+m.di+(m.di===0?' <span style="color:var(--brand)">today</span>':'')+'<div style="font-size:9px;color:var(--faint);font-weight:600">'+fd(d)+' · '+WDN[m.wd]+'</div></th>';}).join('')+'<th class=tot>Total</th></tr></thead><tbody>';
 hours.forEach(function(h){var night=(h==='night');var rt=0;
  s+='<tr><td class=hr>'+(night?'23:00–8:00':h+':00')+'</td>';
  days.forEach(function(d){var v=0;
   if(night){NIGHT.forEach(function(nh){v+=key[nh+'|'+d]||0;});}else{v=key[h+'|'+d]||0;}
   rt+=v;dt2[d]+=v;var m=meta(d);
   var attrs=(drill&&v&&!night)?' class=dr data-d="'+d+'" data-hr="'+h+'" title="click: see these '+v+' leads"':'';
   s+='<td'+attrs+' style="background:'+WD[m.wd]+';color:#3A3348'+((drill&&v&&!night)?';cursor:pointer':'')+'">'+(v||'')+'</td>';});
  s+='<td class=tot>'+rt+'</td></tr>';});
 s+='<tr class=totr><td class=hr style="color:var(--ink);font-weight:800">Total</td>'+days.map(function(d){var m=meta(d);return '<td class=tot style="background:'+WD[m.wd]+'">'+dt2[d]+'</td>';}).join('')+'<td class=tot>'+n(tot)+'</td></tr></tbody></table></div></div>';
 return s;
}
var LEAD_API=API.replace('/data4','/data4lead');
function showDrill(d,hr){
 var ov=document.getElementById('drillov');
 if(!ov){ov=document.createElement('div');ov.id='drillov';
  ov.style.cssText='position:fixed;inset:0;background:rgba(22,16,33,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto';
  ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();});
  document.body.appendChild(ov);}
 ov.innerHTML='<div style="background:var(--card);border-radius:16px;max-width:820px;width:100%;padding:22px 24px;box-shadow:0 20px 60px rgba(22,16,33,.4)">'+
  '<div class=ch2>Leads · '+fd(d)+' · '+hr+':00–'+hr+':59</div><div class=csub>loading journeys… first open of a cell takes ~5–10s, then it&#39;s cached</div></div>';
 fetch(LEAD_API+'?d='+d+'&hr='+hr,{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
  var box=ov.firstChild;if(!j||j.error){box.querySelector('.csub').textContent='error: '+(j&&j.error||'no data');return;}
  var h='<div style="display:flex;justify-content:space-between;align-items:baseline"><div class=ch2>Leads · '+fd(d)+' · '+hr+':00–'+hr+':59 <span class=chip>'+j.n+' leads</span></div>'+
   '<button onclick="document.getElementById(\'drillov\').remove()" style="border:none;background:#E5DFEE;border-radius:8px;padding:6px 14px;font-weight:700;cursor:pointer;color:var(--sub)">close ✕</button></div>'+
   '<div class=csub>Every partner the lead was sent to, in order, and what happened there · times IST</div>';
  (j.leads||[]).forEach(function(L){
   h+='<div style="border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px">'+
    '<div style="font-weight:800;font-size:13.5px;margin-bottom:7px">'+L.mobile+' <span style="color:var(--faint);font-weight:600">· booked '+L.booked+'</span></div>';
   (L.hops||[]).forEach(function(x,i){
    var badge=x.enr?'<span style="font-size:9.5px;font-weight:800;background:#F6E0EE;color:var(--brand);border-radius:5px;padding:1px 6px;margin-left:6px">MG</span>':'';
    var story=[];
    if(x.prop)story.push('slot proposed '+x.prop);
    if(x.asgn)story.push('tech assigned '+x.asgn);
    if(x.inst)story.push('<b style="color:var(--pos)">installed '+x.inst+'</b>');
    if(x.decl)story.push('<b style="color:var(--neg)">declined '+x.decl+'</b>');
    if(!x.inst&&!x.decl)story.push('<span class=warm>'+(x.state||'')+'</span>');
    if(x.reason)story.push('<span style="color:var(--faint)">'+x.reason+'</span>');
    h+='<div style="font-size:12.5px;padding:5px 0 5px 12px;border-left:2px solid '+(x.enr?'#D9008D':'#C9C3D6')+';margin-bottom:4px;line-height:1.5">'+
     '<b>'+(i+1)+'. '+x.csp+'</b>'+badge+' <span style="color:var(--faint)">· sent '+(x.sent||'—')+'</span><br>'+story.join(' · ')+'</div>';});
   h+='</div>';});
  box.innerHTML=h;
 }).catch(function(e){var box=ov.firstChild;box.querySelector('.csub').textContent='could not load ('+e+')';});
}

function miniFun(P,Q){
 if(!Q||!Q.received)return '';
 var pr=P?P.received:0;
 return '<div class=mf>'+STAGES.map(function(s){
  var q=100*(Q[s.k]||0)/Q.received, p=pr?100*(P[s.k]||0)/pr:null;
  if(p!=null&&Math.abs(p-q)<3)p=(p>=q)?q+3:Math.max(2,q-3);
  return '<span class=r><span class=b2 style="width:'+Math.max(5,Math.round(q))+'%"></span>'+
   (p!=null?'<span class=o2 style="width:'+Math.max(4,Math.min(100,Math.round(p)))+'%"></span>':'')+'</span>';}).join('')+'</div>';
}
var MXROWS=[
 {lab:'Bookings', abs:'received', good:'up', absonly:1},
 {lab:'Slot proposed % <span class=mb>MBG</span>', k:'slot_pct', abs:'slot', good:'up'},
 {lab:'Cx confirmed %', k:'confirm_pct', abs:'confirm', good:'up'},
 {lab:'Tech assigned % <span class=mb>MBG</span>', k:'assign_pct', abs:'assign', good:'up'},
 {lab:'Installed %', k:'install_pct', abs:'install', good:'up'},
 {lab:'TAT accept', k:'tat_ta', tat:1, good:'down'},
 {lab:'TAT confirm→assign', k:'tat_ca', tat:1, good:'down'},
 {lab:'TAT assign→install', k:'tat_ai', tat:1, good:'down'}];
function cohortMatrix(groups){
 var s='<div style="overflow-x:auto"><table class=mx><thead><tr><th class=l></th>';
 groups.forEach(function(g){var P=g.data?g.data.PRE:null,Q=g.data?g.data.POST:null;
  s+='<th colspan=2 class=gh>'+miniFun(P,Q)+g.label+'<div class=gn>'+n(g.csps)+' CSPs</div></th>';});
 s+='</tr><tr><th class=l>Metric</th>';
 groups.forEach(function(){s+='<th style="border-left:1px solid var(--line2)">PRE</th><th>POST</th>';});
 s+='</tr></thead><tbody>';
 function stk(top,bot){return '<span class=stk>'+(top?'<span>'+top+'</span>':'')+(bot?'<span class=sb>'+bot+'</span>':'')+'</span>';}
 MXROWS.forEach(function(r){
  s+='<tr><td class=l>'+r.lab+'</td>';
  groups.forEach(function(g){
   var P=g.data?g.data.PRE:null,Q=g.data?g.data.POST:null;
   if(r.tat){
    var pv=P?P[r.k]:null,qv=Q?Q[r.k]:null;
    s+='<td class=prc>'+ft(pv)+'</td><td class=poc><span class=cw><span class=pa>'+ft(qv)+'</span>'+stk(dl(pv,qv,r.good),null)+'</span></td>';
   }else if(r.absonly){
    var pa=P?P[r.abs]:null,qa=Q?Q[r.abs]:null;
    s+='<td class=prc><span class=pa>'+n(pa)+'</span></td><td class=poc><span class=cw><span class=pa>'+n(qa)+'</span>'+stk(dl(pa,qa,r.good),null)+'</span></td>';
   }else{
    var pp=P?P[r.k]:null,qp=Q?Q[r.k]:null,pa2=P?P[r.abs]:null,qa2=Q?Q[r.abs]:null;
    s+='<td class=prc><span class=cw><span class=pa>'+(pp==null?'—':pp+'%')+'</span>'+stk(null,n(pa2))+'</span></td>'+
       '<td class=poc><span class=cw><span class=pa>'+(qp==null?'—':qp+'%')+'</span>'+stk(dl(pp,qp,r.good),n(qa2))+'</span></td>';
   }});
  s+='</tr>';});
 return s+'</tbody></table></div>';
}
function mergedTable(E,N){
 function cell(D,m,pre){var v=D?D[m.k]:null,a=(D&&m.abs)?'<span class=a>'+n(D[m.abs])+'</span>':'';
  return '<td'+(pre?' class=pre':'')+'><span class=p>'+m.fmt(v)+'</span>'+a+'</td>';}
 var s='<table class=t><thead>'+
  '<tr><th class=l></th><th colspan=3 style="text-align:center;color:var(--brand)">Enrolled · own-enrolment window</th>'+
  '<th colspan=3 style="text-align:center;color:#2563EB">Non-enrolled · anchored 1 Jul</th></tr>'+
  '<tr><th class=l>Metric</th><th>PRE</th><th>POST</th><th>Δ</th><th>PRE</th><th>POST</th><th>Δ</th></tr></thead><tbody>';
 METRICS.forEach(function(m){
  var ep=E&&E.PRE?E.PRE[m.k]:null,eq=E&&E.POST?E.POST[m.k]:null;
  var np=N&&N.PRE?N.PRE[m.k]:null,nq=N&&N.POST?N.POST[m.k]:null;
  s+='<tr'+(m.tat?' class=tat':'')+'><td class=l>'+m.lab+'</td>'+
   cell(E&&E.PRE,m,1)+cell(E&&E.POST,m)+'<td>'+dl(ep,eq,m.good)+'</td>'+
   cell(N&&N.PRE,m,1)+cell(N&&N.POST,m)+'<td>'+dl(np,nq,m.good)+'</td></tr>';});
 return s+'</tbody></table>';
}

function render(D){
 document.getElementById('asof').innerHTML='<b>Live</b> · refreshed every 30 min · generated '+D.generated+'<br>'+n(D.enrolled)+' enrolled MG CSPs · '+n(D.targeted)+' banner-targeted';
 document.getElementById('winnote').innerHTML='Windows are <b>per-CSP anchored</b>: POST = each CSP&#39;s own days since its enrolment date (up to '+fd(D.yest)+') · PRE = the same number of days immediately before enrolment · non-enrolled CSPs anchored at MG launch (1 Jul) · <b>all stage % = share of bookings received</b>.';
 var t1=D.tab1||{},E=prep(t1.enr||{}),N=prep(t1.non||{},t1.non_days);
 var F1=prep(t1.enr_f1||null),F2=prep(t1.enr_f2||null);
 (D.tab2||[]).forEach(function(c){prep(c.data);});
 (D.tab3_screens||[]).forEach(function(s){prep(s.data);});
 (D.tab3_engagement||[]).forEach(function(e){prep(e.data);});
 /* ---- TAB 1: three triangle funnels + metric table ---- */
 var f2note=(F2&&F2.POST&&F2.POST.received<20)?'<div class=note>Small group — '+n(F2.POST.csps)+' CSPs and only '+n(F2.POST.received)+' post bookings so far; read direction, not decimals.</div>':'';
 document.getElementById('t1').innerHTML=
  '<div class=grid2>'+
  funnelCard('Enrolled — audit done before',(F1&&F1.POST?n(F1.POST.csps):'—')+' CSPs · pre vs post own enrolment',F1||E)+
  funnelCard('Non-enrolled','anchored 1 Jul · '+(t1.non_days||'—')+'d each side',N)+
  '</div>'+
  '<div class=grid2 style="margin-top:14px">'+
  funnelCard('Enrolled after doing audit',(F2&&F2.POST?n(F2.POST.csps):'—')+' CSPs (audit completed, then enrolled)',F2,false,f2note)+
  '<div class=card><div class=cuthdr><span class=nm>All metrics</span><span class=n>enrolled (all) vs non-enrolled</span></div><div style="overflow-x:auto">'+mergedTable(E,N)+'</div></div>'+
  '</div>'+
  '<div class=card style="margin-top:14px"><div class=note style="border:none;margin:0;padding:0">Per-CSP/day shown for enrolled only. Non-enrolled moves with season/city mix — context, not a strict control. Recent bookings are still in flight, so POST %s settle upward over a day or two; PRE (older) is fully matured.</div></div>';
 /* ---- TAB 2: funnel per feedback cohort ---- */
 var h2='<div class=card><div class=ch2>Feedback cohorts · PRE vs POST</div><div class=csub>Cohort = the CSP&#39;s in-app feedback answer · mini funnel = POST shape · all % of received</div>'+
  cohortMatrix((D.tab2||[]).map(function(c){return {label:c.label,csps:c.csps,data:c.data};}))+'</div><div class=card><div class=note style="border:none;margin:0;padding:0">Cohort = the CSP&#39;s in-app feedback answer (latest owner/admin answer wins). Unaware CSPs are being called and walked through the program — watch that funnel fill toward Excited&#39;s shape.</div></div>';
 document.getElementById('t2').innerHTML=h2;
 /* ---- TAB 3: funnels for screens + engagement ---- */
 var va=D.tab3_view_action||{};
 var vastrip=(va.median_min!=null)?
  '<div class=card><div class=ch2>After viewing the banner → first action on a lead</div>'+
  '<div class=csub>Of <b>'+n(va.n_viewed)+'</b> CSPs who viewed, <b>'+n(va.acted)+'</b> ('+va.acted_pct+'%) took a lead action after the view (slot proposed · tech assigned · install step · declined) · median <b>'+ft(va.median_min)+'</b> · p75 <b>'+ft(va.p75_min)+'</b> · '+va.within24h_pct+'% acted within 24h · <span style="color:var(--faint)">includes waiting for the next lead to arrive — not pure response speed</span></div></div>':'';
 var h3=vastrip+'<div class=card><div class=ch2>By banner screen · PRE vs POST</div><div class=csub>Which MBG card each CSP sees, by its live install-rate state · <span class=warm>noleads excluded — no lead flow in that state, nothing to compare</span></div>'+
  cohortMatrix((D.tab3_screens||[]).filter(function(s){return s.key!=='noleads';}).map(function(s){return {label:s.key,csps:s.csps,data:s.data};}))+'</div>'+
  '<div class=card><div class=ch2>By engagement depth · PRE vs POST</div><div class=csub>From the banner&#39;s own events: Viewed → Scrolled → Tapped Guarantee → Ticket tap (CSP counts once if any owner/admin fired it)</div>'+
  cohortMatrix((D.tab3_engagement||[]).map(function(e){return {label:e.key,csps:e.csps,data:e.data};}))+'</div><div class=card><div class=note style="border:none;margin:0;padding:0"><b>Read with care:</b> engagement is self-selected — CSPs who view/scroll/tap are the more active ones to begin with. The honest signal is each group&#39;s own PRE (dotted) vs POST (filled) shape, not group vs group.</div></div>';
 document.getElementById('t3').innerHTML=h3;
 /* ---- TAB 4: grouped bars + heatmaps ---- */
 var t4=D.tab4||{},daily=t4.daily||[];
 var h4='';
 if(daily.length){
  h4+='<div class=card><div class=ch2>Bookings &amp; installs per day · enrolled CSPs</div><div class=csub>Day on day since '+fd(t4.from||daily[0].d)+' · complete days only · installs by event day</div>'+
   barsChart(daily,D.launch)+'</div>';
 }
 h4+=heatmap(t4.hourly_book,'Bookings received · hour × day','when demand lands through the day (IST)',true);
 h4+=heatmap(t4.hourly_inst,'Installs completed · hour × day','when installs finish through the day (IST)');
 document.getElementById('t4').innerHTML=h4;
 document.getElementById('t4').onclick=function(e){
  var td=e.target.closest?e.target.closest('td.dr'):null;
  if(td)showDrill(td.getAttribute('data-d'),td.getAttribute('data-hr'));};
}
function boot(){fetch(API,{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
 if(d&&d.tab1)render(d);
 else document.getElementById('asof').textContent='data warming up… (first load after deploy takes ~10 min)';
}).catch(function(e){document.getElementById('t1').innerHTML='<div class="card err">Could not reach live data ('+e+'). Retrying…</div>';});}
boot();setInterval(boot,300000);
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});b.classList.add('on');['t1','t2','t3','t4'].forEach(function(id){document.getElementById(id).classList.toggle('hide',id!==b.dataset.t);});};});
</script></body></html>
