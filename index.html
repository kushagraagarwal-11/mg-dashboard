<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1"><title>MG Program — Funnel Cuts</title>
<style>
:root{--bg:#F1EDF7;--card:#FAF9FC;--ink:#161021;--sub:#665E75;--faint:#8C8699;--line:#E6E1EE;--line2:#EFEBF5;
--brand:#D9008D;--blue:#2563EB;--pos:#06874E;--neg:#D92D20;--warm:#B45309}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);
-webkit-font-smoothing:antialiased;padding:26px 22px 60px;max-width:1220px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:6px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);margin-bottom:5px}
h1{font-size:clamp(1.5rem,3vw,2.1rem);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.asof{font-size:12.5px;color:var(--sub);text-align:right;line-height:1.7;padding-top:4px}
.asof b{color:var(--ink);font-weight:700}
.winnote{font-size:12px;color:var(--sub);margin:2px 0 16px;font-weight:600}
.winnote b{color:var(--brand)}
.tabs{display:inline-flex;gap:2px;background:#E5DFEE;padding:3px;border-radius:12px;margin-bottom:18px;flex-wrap:wrap}
.tab{border:none;background:transparent;color:var(--sub);border-radius:9px;padding:8px 16px;font-size:13.5px;font-weight:650;cursor:pointer;transition:.12s;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(22,16,33,.14),0 0 0 .5px rgba(22,16,33,.04)}
.card{background:var(--card);border:1px solid #EAE5F1;border-radius:16px;box-shadow:0 4px 24px rgba(22,16,33,.06);padding:18px 20px;margin-bottom:14px;position:relative}
.ch2{font-size:15px;font-weight:750;letter-spacing:-.01em}
.ch2 .chip{font-size:10.5px;font-weight:800;background:#F6E0EE;color:var(--brand);border-radius:6px;padding:2px 8px;margin-left:8px;vertical-align:2px}
.csub{font-size:12.5px;color:var(--sub);margin-top:2px;margin-bottom:12px}.csub b{color:var(--ink)}
.note{font-size:11.5px;color:var(--sub);margin-top:12px;line-height:1.6;padding-top:11px;border-top:1px solid var(--line2)}
/* funnel bars (tab1 hero) */
.fnl{display:flex;flex-direction:column;gap:9px;margin:4px 0 6px}
.frow{display:grid;grid-template-columns:230px 1fr 150px;align-items:center;gap:14px}
.frow .nm{font-size:13px;font-weight:650;color:#4A4258}
.frow .nm .mb{color:var(--brand);font-weight:800}
.frow .track{height:23px;border-radius:6px;background:#F3E6F0;position:relative;overflow:hidden}
.frow .fill{position:absolute;top:0;left:0;bottom:0;border-radius:0 4px 4px 0;background:var(--brand)}
.frow .val{text-align:right;white-space:nowrap}
.frow .val .vp{font-size:16px;font-weight:800;letter-spacing:-.02em}
.frow .val .va{font-size:11px;color:var(--faint);margin-left:6px;font-weight:600}
@media(max-width:640px){.frow{grid-template-columns:120px 1fr 110px;gap:8px}.frow .nm{font-size:11px}}
/* metric tables */
table.t{border-collapse:collapse;width:100%}
.t thead th{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);text-align:right;padding:0 10px 8px;border-bottom:1px solid var(--line)}
.t thead th.l{text-align:left}
.t td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:right;vertical-align:middle;font-variant-numeric:tabular-nums}
.t tr:last-child td{border-bottom:none}
.t td.l{text-align:left;font-size:12.5px;color:#4A4258;font-weight:600}
.t td.l .mb{color:var(--brand);font-weight:800}
.t td.l .of{color:var(--faint);font-weight:600;font-size:11px}
.t td .p{font-size:16px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.t td .a{font-size:11px;color:var(--faint);font-weight:600;margin-left:4px}
.t td.pre .p{color:#948DA5;font-size:14.5px}
.t tr.tat td .p{font-size:14px;font-weight:750;color:#4A4258}
.dl{font-size:11.5px;font-weight:750;display:inline-flex;align-items:center;gap:2px}.up{color:var(--pos)}.dn{color:var(--neg)}.fl{color:var(--faint)}
/* cut cards grid */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(345px,1fr));gap:14px}
.grid .card{margin-bottom:0}
.cuthdr{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.cuthdr .nm{font-size:15px;font-weight:800}
.cuthdr .n{font-size:12px;color:var(--faint);font-weight:700}
.small .t td{padding:6.5px 8px}.small .t td .p{font-size:14px}.small .t td.pre .p{font-size:12.5px}
/* charts + heatmap */
.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:600}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:14px;height:0;border-top:2.5px solid;border-radius:2px;display:inline-block}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:#211A2E;color:#fff;border-radius:9px;padding:8px 11px;font-size:12px;line-height:1.55;box-shadow:0 6px 20px rgba(22,16,33,.35);opacity:0;transition:opacity .08s;z-index:5;white-space:nowrap}
.tip .th{font-weight:700;font-size:11px;color:#B9B3C6;margin-bottom:3px}
.tip .tr2{display:flex;align-items:center;gap:7px}
.tip .tr2 i{width:11px;height:0;border-top:2.5px solid;border-radius:2px;display:inline-block}
.tip .tr2 b{font-weight:800;margin-left:auto;padding-left:12px}
table.hm{border-collapse:collapse;font-size:12px;width:100%}
.hm th{color:var(--sub);font-weight:650;padding:4px 5px;text-align:center;font-size:10.5px}.hm th.hr{text-align:right}
.hm td{text-align:center;font-weight:700;padding:4px 3px;color:#3A3348;font-variant-numeric:tabular-nums;min-width:26px}
.hm td.hr{color:var(--faint);text-align:right;padding-right:9px;font-weight:600}
.hm td.tot,.hm th.tot{font-weight:800;color:var(--ink)}.hm tr.totr td{border-top:1px solid var(--line);padding-top:6px}
.hide{display:none}.err{color:var(--neg);font-weight:600;padding:22px}
.warm{color:var(--warm);font-weight:700}
</style></head><body>
<div class=top><div><div class=eyebrow>WIOM · Minimum Guarantee Program</div><h1>Booking → Install · Funnel Cuts</h1></div>
<div class=asof id=asof>loading…</div></div>
<div class=winnote id=winnote></div>
<div class=tabs>
 <button class="tab on" data-t=t1>① Overview</button>
 <button class=tab data-t=t2>② Feedback cohorts</button>
 <button class=tab data-t=t3>③ Banner campaigns</button>
 <button class=tab data-t=t4>④ DoD · Hour-of-day</button>
</div>
<div id=t1></div><div id=t2 class=hide></div><div id=t3 class=hide></div><div id=t4 class=hide></div>
<script>
var API='https://web-production-9f444.up.railway.app/data4';
function n(v){return v==null?'—':Number(v).toLocaleString('en-IN');}
function ft(m){if(m==null)return '—';return m<90?Math.round(m)+'m':(m/60).toFixed(1)+'h';}
var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fd(d){var a=d.split('-');return (+a[2])+' '+MO[+a[1]-1];}
function dl(pre,post,good){if(pre==null||post==null||!pre)return '<span class="dl fl">—</span>';
 var pc=Math.round((post-pre)/Math.abs(pre)*100);if(pc===0)return '<span class="dl fl">0%</span>';
 var up=good==='up'?pc>0:pc<0;return '<span class="dl '+(up?'up':'dn')+'">'+(pc>0?'▲':'▼')+Math.abs(pc)+'%</span>';}

/* ---- the 8 funnel metrics, one definition everywhere ---- */
var METRICS=[
 {k:'recv_d', lab:'Bookings received <span class=of>/ day</span>', fmt:function(v){return v==null?'—':v;}, good:'up'},
 {k:'slot_pct',    lab:'Slot proposed / CSP accepted <span class=of>% of received</span> <span class=mb>· MBG</span>', fmt:function(v){return v==null?'—':v+'%';}, good:'up', abs:'slot'},
 {k:'confirm_pct', lab:'Customer slot confirmed <span class=of>% of slot proposed</span>', fmt:function(v){return v==null?'—':v+'%';}, good:'up', abs:'confirm'},
 {k:'assign_pct',  lab:'Technician assigned <span class=of>% of confirmed</span> <span class=mb>· MBG</span>', fmt:function(v){return v==null?'—':v+'%';}, good:'up', abs:'assign'},
 {k:'install_pct', lab:'Installed <span class=of>% of received</span>', fmt:function(v){return v==null?'—':v+'%';}, good:'up', abs:'install'},
 {k:'tat_ta', lab:'TAT · first task → CSP accepted <span class=of>incl. reassignment wait</span>', fmt:ft, good:'down', tat:1},
 {k:'tat_ca', lab:'TAT · slot confirmed → tech assigned', fmt:ft, good:'down', tat:1},
 {k:'tat_ai', lab:'TAT · assigned → installed', fmt:ft, good:'down', tat:1}];

function funnelTable(P,Q,small){
 var s='<table class=t><thead><tr><th class=l>Metric</th><th>PRE</th><th>POST</th><th>Δ</th></tr></thead><tbody>';
 METRICS.forEach(function(m){
  var pv=P?P[m.k]:null,qv=Q?Q[m.k]:null;
  var pa=(P&&m.abs)?'<span class=a>'+n(P[m.abs])+'</span>':'',qa=(Q&&m.abs)?'<span class=a>'+n(Q[m.abs])+'</span>':'';
  s+='<tr'+(m.tat?' class=tat':'')+'><td class=l>'+m.lab+'</td><td class=pre><span class=p>'+m.fmt(pv)+'</span>'+pa+'</td>'+
     '<td><span class=p>'+m.fmt(qv)+'</span>'+qa+'</td><td>'+dl(pv,qv,m.good)+'</td></tr>';});
 return s+'</tbody></table>';
}
/* one merged table: enrolled + non-enrolled side by side */
function mergedTable(E,N){
 function cell(D,m,pre){var v=D?D[m.k]:null,a=(D&&m.abs)?'<span class=a>'+n(D[m.abs])+'</span>':'';
  return '<td'+(pre?' class=pre':'')+'><span class=p>'+m.fmt(v)+'</span>'+a+'</td>';}
 var s='<table class=t><thead>'+
  '<tr><th class=l></th><th colspan=3 style="text-align:center;color:var(--brand)">Enrolled · own-enrolment window</th>'+
  '<th colspan=3 style="text-align:center;color:#2563EB">Non-enrolled · anchored 1 Jul</th></tr>'+
  '<tr><th class=l>Metric</th><th>PRE</th><th>POST</th><th>Δ</th><th>PRE</th><th>POST</th><th>Δ</th></tr></thead><tbody>';
 METRICS.forEach(function(m){
  var ep=E&&E.PRE?E.PRE[m.k]:null,eq=E&&E.POST?E.POST[m.k]:null;
  var np=N&&N.PRE?N.PRE[m.k]:null,nq=N&&N.POST?N.POST[m.k]:null;
  s+='<tr'+(m.tat?' class=tat':'')+'><td class=l>'+m.lab+'</td>'+
   cell(E&&E.PRE,m,1)+cell(E&&E.POST,m)+'<td>'+dl(ep,eq,m.good)+'</td>'+
   cell(N&&N.PRE,m,1)+cell(N&&N.POST,m)+'<td>'+dl(np,nq,m.good)+'</td></tr>';});
 return s+'</tbody></table>';
}
function cutCard(name,ncsp,d,extra){
 var P=d?d.PRE:null,Q=d?d.POST:null;
 return '<div class="card small"><div class=cuthdr><span class=nm>'+name+'</span><span class=n>'+n(ncsp)+' CSPs'+(extra||'')+'</span></div>'+
        funnelTable(P,Q,1)+'</div>';
}
function funnelBars(Q){
 if(!Q)return '';
 var shares=[100,Q.slot_pct||0];
 shares.push(shares[1]*(Q.confirm_pct||0)/100);
 shares.push(shares[2]*(Q.assign_pct||0)/100);
 shares.push(Q.install_pct||0);
 var rows=[['Bookings received','',n(Q.received)],
  ['Slot proposed / accepted <span class=mb>MBG</span>',(Q.slot_pct||'—')+'% of received',n(Q.slot)],
  ['Customer confirmed slot',(Q.confirm_pct||'—')+'% of proposed',n(Q.confirm)],
  ['Technician assigned <span class=mb>MBG</span>',(Q.assign_pct||'—')+'% of confirmed',n(Q.assign)],
  ['Installed',(Q.install_pct||'—')+'% of received',n(Q.install)]];
 var s='<div class=fnl>';
 rows.forEach(function(r,i){var w=Math.max(3,shares[i]);
  s+='<div class=frow><span class=nm>'+r[0]+'</span><span class=track><span class=fill style="width:'+w+'%"></span></span>'+
     '<span class=val><span class=vp>'+(i===0?r[2]:r[1])+'</span><span class=va>'+(i===0?'bookings':r[2])+'</span></span></div>';});
 return s+'</div>';
}

/* ---- line chart + hover (shared engine) ---- */
function niceScale(mx){if(mx<=0)return{max:4,step:1};
 var raw=mx/4,pow=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),c=raw/pow,st;
 st=(c<=1?1:c<=2?2:c<=2.5?2.5:c<=5?5:10)*pow;return{max:st*4,step:st};}
var CH={};
function lineChart(id,days,series,fmt,mark){
 var W=1100,H=280,padL=46,padR=70,padT=16,padB=28,iw=W-padL-padR,ih=H-padT-padB;
 var mx=0;series.forEach(function(s){s.v.forEach(function(y){if(y!=null&&y>mx)mx=y;});});
 var sc=niceScale(mx*1.04),x=function(i){return padL+(days.length<2?iw/2:iw*i/(days.length-1));},y=function(v){return padT+ih-(v/sc.max)*ih;};
 var g='';for(var k=0;k<=4;k++){var gv=sc.step*k,gy=y(gv);
  g+='<line x1='+padL+' y1='+gy.toFixed(1)+' x2='+(W-padR)+' y2='+gy.toFixed(1)+' stroke="#EFEBF5" stroke-width=1 />'+
     '<text x='+(padL-8)+' y='+(gy+3.5).toFixed(1)+' text-anchor=end fill="#8C8699" font-size=10.5>'+fmt(gv)+'</text>';}
 var step=Math.max(1,Math.ceil(days.length/12)),xl='';
 days.forEach(function(d,i){if(i%step&&i!==days.length-1)return;xl+='<text x='+x(i).toFixed(1)+' y='+(H-8)+' text-anchor=middle fill="#8C8699" font-size=10.5>'+fd(d)+'</text>';});
 var mk='';
 if(mark){var mi=days.indexOf(mark);if(mi>=0){var mxp=x(mi);
  mk='<line x1='+mxp.toFixed(1)+' y1='+padT+' x2='+mxp.toFixed(1)+' y2='+(padT+ih)+' stroke="#D9008D" stroke-width=1.5 stroke-dasharray="4 4" opacity=".55"/>'+
     '<text x='+(mxp+5).toFixed(1)+' y='+(padT+11)+' fill="#D9008D" font-size=10.5 font-weight=800>MG launch</text>';}}
 var areas='',paths='',ends='';
 series.forEach(function(s){
  var p='',first=null,lastI=null;
  s.v.forEach(function(v,i){if(v==null)return;if(first===null)first=i;lastI=i;p+=(p?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';});
  if(first===null)return;
  areas+='<path d="'+p+'L'+x(lastI).toFixed(1)+' '+(padT+ih)+' L'+x(first).toFixed(1)+' '+(padT+ih)+' Z" fill="'+s.c+'" opacity=".07"/>';
  paths+='<path d="'+p+'" fill="none" stroke="'+s.c+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  var lv=s.v[lastI];
  ends+='<circle cx='+x(lastI).toFixed(1)+' cy='+y(lv).toFixed(1)+' r=4 fill="'+s.c+'" stroke="#FAF9FC" stroke-width=2 />'+
        '<text x='+(x(lastI)+8).toFixed(1)+' y='+(y(lv)+3.5).toFixed(1)+' fill="#161021" font-size=11.5 font-weight=800>'+fmt(lv)+'</text>';});
 var lg='<div class=lgd>'+series.map(function(s){return '<span><i style="border-color:'+s.c+'"></i>'+s.n+'</span>';}).join('')+'</div>';
 CH[id]={days:days,series:series,fmt:fmt,padL:padL,padR:padR,padT:padT,ih:ih,W:W,H:H};
 return lg+'<div class=chart id='+id+'><svg viewBox="0 0 '+W+' '+H+'">'+g+mk+areas+paths+
  '<line class=xh x1=0 y1='+padT+' x2=0 y2='+(padT+ih)+' stroke="#B9B3C6" stroke-width=1 opacity=0 />'+ends+xl+'</svg><div class=tip></div></div>';
}
function bindHover(){
 Object.keys(CH).forEach(function(id){
  var m=CH[id],box=document.getElementById(id);if(!box||box._b)return;box._b=1;
  var svg=box.querySelector('svg'),xh=svg.querySelector('.xh'),tip=box.querySelector('.tip');
  svg.addEventListener('pointermove',function(ev){
   var r=svg.getBoundingClientRect(),sx=(ev.clientX-r.left)*m.W/r.width;
   var iw=m.W-m.padL-m.padR,rel=(sx-m.padL)/(iw||1),i=Math.round(rel*(m.days.length-1));
   if(i<0)i=0;if(i>m.days.length-1)i=m.days.length-1;
   var cx=m.padL+(m.days.length<2?iw/2:iw*i/(m.days.length-1));
   xh.setAttribute('x1',cx);xh.setAttribute('x2',cx);xh.setAttribute('opacity','1');
   while(tip.firstChild)tip.removeChild(tip.firstChild);
   var h=document.createElement('div');h.className='th';h.textContent=fd(m.days[i]);tip.appendChild(h);
   m.series.forEach(function(s){var v=s.v[i];if(v==null)return;
    var row=document.createElement('div');row.className='tr2';
    var key=document.createElement('i');key.style.borderColor=s.c;row.appendChild(key);
    var nm=document.createElement('span');nm.textContent=s.n;row.appendChild(nm);
    var b=document.createElement('b');b.textContent=m.fmt(v);row.appendChild(b);tip.appendChild(row);});
   var px=cx*r.width/m.W;
   tip.style.opacity=1;tip.style.left=Math.max(4,Math.min(px+14,r.width-tip.offsetWidth-8))+'px';tip.style.top='16px';});
  svg.addEventListener('pointerleave',function(){xh.setAttribute('opacity','0');tip.style.opacity=0;});});
}
function heatmap(cells,title,sub,drill){
 if(!cells||!cells.length)return '<div class=card><div class=ch2>'+title+'</div><div class=csub>no data yet</div></div>';
 var days=Array.from(new Set(cells.map(function(x){return x.d;}))).sort(),key={},mx=0,tot=0;
 cells.forEach(function(x){key[x.hr+'|'+x.d]=(key[x.hr+'|'+x.d]||0)+x.n;if(key[x.hr+'|'+x.d]>mx)mx=key[x.hr+'|'+x.d];tot+=x.n;});
 var hrs=cells.map(function(x){return x.hr;}),hmin=Math.min.apply(null,hrs),hmax=Math.max.apply(null,hrs),hours=[];
 for(var h=hmin;h<=hmax;h++)hours.push(h);
 var dt={};days.forEach(function(d){dt[d]=0;});
 var s='<div class=card><div class=ch2>'+title+'</div><div class=csub><b>'+n(tot)+'</b> total · '+sub+' · darker = more'+(drill?' · <b>click a cell for the lead journeys</b>':'')+'</div><div style="overflow-x:auto"><table class=hm><thead><tr><th class=hr>Hour</th>'+
   days.map(function(d){return '<th>'+fd(d)+'</th>';}).join('')+'<th class=tot>Total</th></tr></thead><tbody>';
 hours.forEach(function(h){var rt=0;s+='<tr><td class=hr>'+h+':00</td>';
  days.forEach(function(d){var v=key[h+'|'+d]||0;rt+=v;dt[d]+=v;var op=mx?v/mx:0;
   var attrs=(drill&&v)?' class=dr data-d="'+d+'" data-hr="'+h+'" title="click: see these '+v+' leads"':'';
   s+='<td'+attrs+' style="background:'+(v?'rgba(217,0,141,'+(0.07+0.75*op).toFixed(2)+')':'transparent')+';color:'+(op>.55?'#fff':'#3A3348')+(drill&&v?';cursor:pointer':'')+'">'+(v||'')+'</td>';});
  s+='<td class=tot>'+rt+'</td></tr>';});
 s+='<tr class=totr><td class=hr style="color:var(--ink);font-weight:800">Total</td>'+days.map(function(d){return '<td class=tot>'+dt[d]+'</td>';}).join('')+'<td class=tot>'+n(tot)+'</td></tr></tbody></table></div></div>';
 return s;
}
/* ---- lead-journey modal (heatmap drill) ---- */
var LEAD_API=API.replace('/data4','/data4lead');
function showDrill(d,hr){
 var ov=document.getElementById('drillov');
 if(!ov){ov=document.createElement('div');ov.id='drillov';
  ov.style.cssText='position:fixed;inset:0;background:rgba(22,16,33,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto';
  ov.addEventListener('click',function(e){if(e.target===ov)ov.remove();});
  document.body.appendChild(ov);}
 ov.innerHTML='<div style="background:var(--card);border-radius:16px;max-width:820px;width:100%;padding:22px 24px;box-shadow:0 20px 60px rgba(22,16,33,.4)">'+
  '<div class=ch2>Leads · '+fd(d)+' · '+hr+':00–'+hr+':59</div><div class=csub>loading journeys… first open of a cell takes ~5–10s, then it&#39;s cached</div></div>';
 fetch(LEAD_API+'?d='+d+'&hr='+hr,{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
  var box=ov.firstChild;if(!j||j.error){box.querySelector('.csub').textContent='error: '+(j&&j.error||'no data');return;}
  var h='<div style="display:flex;justify-content:space-between;align-items:baseline"><div class=ch2>Leads · '+fd(d)+' · '+hr+':00–'+hr+':59 <span class=chip>'+j.n+' leads</span></div>'+
   '<button onclick="document.getElementById(\'drillov\').remove()" style="border:none;background:#E5DFEE;border-radius:8px;padding:6px 14px;font-weight:700;cursor:pointer;color:var(--sub)">close ✕</button></div>'+
   '<div class=csub>Every partner the lead was sent to, in order, and what happened there · times IST</div>';
  (j.leads||[]).forEach(function(L){
   h+='<div style="border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px">'+
    '<div style="font-weight:800;font-size:13.5px;margin-bottom:7px">'+L.mobile+' <span style="color:var(--faint);font-weight:600">· booked '+L.booked+'</span></div>';
   (L.hops||[]).forEach(function(x,i){
    var badge=x.enr?'<span style="font-size:9.5px;font-weight:800;background:#F6E0EE;color:var(--brand);border-radius:5px;padding:1px 6px;margin-left:6px">MG</span>':'';
    var story=[];
    if(x.prop)story.push('slot proposed '+x.prop);
    if(x.asgn)story.push('tech assigned '+x.asgn);
    if(x.inst)story.push('<b style="color:var(--pos)">installed '+x.inst+'</b>');
    if(x.decl)story.push('<b style="color:var(--neg)">declined '+x.decl+'</b>');
    if(!x.inst&&!x.decl)story.push('<span class=warm>'+(x.state||'')+'</span>');
    if(x.reason)story.push('<span style="color:var(--faint)">'+x.reason+'</span>');
    h+='<div style="font-size:12.5px;padding:5px 0 5px 12px;border-left:2px solid '+(x.enr?'#D9008D':'#C9C3D6')+';margin-bottom:4px;line-height:1.5">'+
     '<b>'+(i+1)+'. '+x.csp+'</b>'+badge+' <span style="color:var(--faint)">· sent '+(x.sent||'—')+'</span><br>'+story.join(' · ')+'</div>';});
   h+='</div>';});
  box.innerHTML=h;
 }).catch(function(e){var box=ov.firstChild;box.querySelector('.csub').textContent='could not load ('+e+')';});
}

function prep(blk,fixedDays){ // add recv_d = bookings/day to each PRE/POST block
 if(!blk)return blk;
 ['PRE','POST'].forEach(function(p){var m=blk[p];if(!m)return;
  if(m.csp_days&&m.csps)m.recv_d=Math.round(10*m.received*m.csps/m.csp_days)/10;
  else if(fixedDays)m.recv_d=Math.round(10*m.received/fixedDays)/10;});
 return blk;
}
function render(D){
 document.getElementById('asof').innerHTML='<b>Live</b> · refreshed every 30 min · generated '+D.generated+'<br>'+n(D.enrolled)+' enrolled MG CSPs · '+n(D.targeted)+' banner-targeted';
 document.getElementById('winnote').innerHTML='Windows are <b>per-CSP anchored</b>: POST = each CSP&#39;s own days since its enrolment date (up to '+fd(D.yest)+') · PRE = the same number of days immediately before enrolment · non-enrolled CSPs anchored at MG launch (1 Jul).';
 /* ---- TAB 1 ---- */
 var t1=D.tab1||{},E=prep(t1.enr||{}),N=prep(t1.non||{},t1.non_days);
 (D.tab2||[]).forEach(function(c){prep(c.data);});
 (D.tab3_screens||[]).forEach(function(s){prep(s.data);});
 (D.tab3_engagement||[]).forEach(function(e){prep(e.data);});
 document.getElementById('t1').innerHTML=
  '<div class=card><div class=ch2>Enrolled funnel · POST<span class=chip>'+n(D.enrolled)+' CSPs</span></div>'+
  '<div class=csub>Current position of bookings received post-enrolment · <span class=mb style="color:var(--brand);font-weight:800">MBG</span> = the two indicators in the CSP&#39;s hands</div>'+
  funnelBars(E.POST)+'</div>'+
  '<div class=card><div class=cuthdr><span class=nm>Enrolled vs Non-enrolled</span><span class=n>'+n(D.enrolled)+' enrolled CSPs · non-enrolled '+(t1.non_days||'—')+'d each side</span></div>'+
  '<div style="overflow-x:auto">'+mergedTable(E,N)+'</div>'+
  '<div class=note>Per-CSP/day is shown for enrolled only (fixed cohort denominator); non-enrolled columns show totals. Non-enrolled moves with season/city mix — context, not a strict control. Recent bookings are still in flight, so POST funnel %s settle upward over a day or two.</div></div>';
 /* ---- TAB 2 ---- */
 var h2='<div class=grid>';
 (D.tab2||[]).forEach(function(c){h2+=cutCard(c.label,c.csps,c.data);});
 h2+='</div><div class=card><div class=note style="border:none;margin:0;padding:0">Cohorts = the CSP&#39;s answer on the in-app feedback (flow 3); a CSP&#39;s category is its latest owner/admin answer. Unaware CSPs are being called and walked through the program — watch this column converge to Excited.</div></div>';
 document.getElementById('t2').innerHTML=h2;
 /* ---- TAB 3 ---- */
 var va=D.tab3_view_action||{};
 var vastrip=(va.median_min!=null)?
  '<div class=card><div class=ch2>After viewing the banner → first action on a lead</div>'+
  '<div class=csub>Of <b>'+n(va.n_viewed)+'</b> CSPs who viewed, <b>'+n(va.acted)+'</b> ('+va.acted_pct+'%) took a lead action after the view (slot proposed · tech assigned · install step · declined) · median <b>'+ft(va.median_min)+'</b> · p75 <b>'+ft(va.p75_min)+'</b> · '+va.within24h_pct+'% acted within 24h of viewing · <span style="color:var(--faint)">includes waiting for the next lead to arrive — it is not pure response speed</span></div></div>':'';
 var h3=vastrip+'<div class=card style="padding:14px 20px"><div class=ch2>By banner screen</div><div class=csub>Which MBG card each CSP sees, by its live install-rate state · <span class=warm>noleads excluded — no lead flow in that state, nothing to compare</span></div></div><div class=grid>';
 (D.tab3_screens||[]).forEach(function(s){if(s.key==='noleads')return;h3+=cutCard(s.key,s.csps,s.data);});
 h3+='</div><div class=card style="padding:14px 20px;margin-top:14px"><div class=ch2>By engagement depth</div><div class=csub>From the banner&#39;s own events: Viewed → Scrolled → Tapped Guarantee → Ticket tap (CSP counts once if any owner/admin fired it)</div></div><div class=grid>';
 (D.tab3_engagement||[]).forEach(function(e){h3+=cutCard(e.key,e.csps,e.data);});
 h3+='</div><div class=card><div class=note style="border:none;margin:0;padding:0"><b>Read with care:</b> engagement is self-selected — CSPs who view/scroll/tap are the more active ones to begin with, so their better funnel is correlation, not proof. The honest signal is each group&#39;s own PRE → POST delta, not group vs group.</div></div>';
 document.getElementById('t3').innerHTML=h3;
 /* ---- TAB 4 ---- */
 var t4=D.tab4||{},daily=t4.daily||[];
 var days=daily.map(function(x){return x.d;});
 var launch=(D.launch&&days.indexOf(D.launch)>=0)?D.launch:null;
 var h4='';
 if(daily.length){
  h4+='<div class=card><div class=ch2>Bookings &amp; installs per day · enrolled CSPs</div><div class=csub>Day on day since '+fd(t4.from||days[0])+' · complete days only</div>'+
   lineChart('c41',days,[{n:'Bookings received',c:'#2563EB',v:daily.map(function(x){return x.b;})},
                        {n:'Installs',c:'#D9008D',v:daily.map(function(x){return x.i;})}],function(v){return n(Math.round(v));},launch)+'</div>';
 }
 h4+=heatmap(t4.hourly_book,'Bookings received · hour × day','when demand lands through the day (IST)',true);
 h4+=heatmap(t4.hourly_inst,'Installs completed · hour × day','when installs finish through the day (IST)');
 document.getElementById('t4').innerHTML=h4;
 document.getElementById('t4').onclick=function(e){
  var td=e.target.closest?e.target.closest('td.dr'):null;
  if(td)showDrill(td.getAttribute('data-d'),td.getAttribute('data-hr'));};
 bindHover();
}
function boot(){fetch(API,{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
 if(d&&d.tab1)render(d);
 else document.getElementById('asof').textContent='data warming up… (first load after deploy takes ~10 min)';
}).catch(function(e){document.getElementById('t1').innerHTML='<div class="card err">Could not reach live data ('+e+'). Retrying…</div>';});}
boot();setInterval(boot,300000);
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});b.classList.add('on');['t1','t2','t3','t4'].forEach(function(id){document.getElementById(id).classList.toggle('hide',id!==b.dataset.t);});};});
</script></body></html>
