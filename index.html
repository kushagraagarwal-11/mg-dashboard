<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1"><title>MG Program — Funnels & Metrics</title>
<style>
:root{--acc:#6d17ce;--acc2:#a855f7;--pink:#d9008d;--bg:#f1edf7;--card:#faf9fc;--ink:#161021;--mut:#665e75;--grid:#e8e4f0;--green:#008043;--red:#e01e00}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:22px;max-width:1200px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:clamp(1.4rem,3vw,2rem);font-weight:800;line-height:1.15}
.lbl{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}
.asof{font-size:13px;color:var(--mut)}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{border:none;background:var(--card);color:var(--mut);border-radius:40px;padding:9px 22px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 16px rgba(22,16,33,.06)}
.tab.on{background:var(--ink);color:#fff}
.card{background:var(--card);border-radius:16px;box-shadow:0 4px 24px rgba(22,16,33,.06);padding:20px 24px;margin-bottom:18px}
.card h2{font-size:1.05rem;font-weight:800;margin-bottom:3px}.card .sub{font-size:13px;color:var(--mut);margin-bottom:12px}
table.ft{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.ft th{font-size:12px;color:var(--mut);font-weight:700;text-align:right;padding:7px 12px;border-bottom:2px solid var(--grid)}.ft th.l{text-align:left}
.ft td{font-size:18px;font-weight:800;text-align:right;padding:9px 12px;border-bottom:1px solid #efeaf6}
.ft td.l{text-align:left;font-size:14px;color:#453f54;font-weight:600}
.ft td.pre{color:#b5688f}.ft td.post{color:var(--ink)}.ft td.non{color:var(--mut);font-size:16px;font-weight:700}
.ft .pc{font-size:12.5px;font-weight:800;color:var(--acc);margin-left:3px}
.ft td.pre .pc{color:#c98db3}.ft td.non .pc{color:#9a90ab}
.ft tr.sub td{font-size:14px;font-weight:600;padding-top:2px;border-bottom:1px solid #efeaf6;color:#8a5a00}
.ft tr.sub td.l{font-size:12px;color:#8a5a00}
.ft tr.grp td{border-bottom:2px solid var(--grid)}
.ft tr.tat td{font-size:16px}.ft tr.tat td.l{color:#5a5468}
.delta{font-size:13px;font-weight:800}.up{color:var(--green)}.dn{color:var(--red)}.flat{color:#a49bb3}
.note{font-size:12.5px;color:var(--mut);margin-top:10px;line-height:1.5}
table.co{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.co th{font-size:12px;color:var(--mut);font-weight:700;text-align:right;padding:8px 10px;border-bottom:2px solid var(--grid)}.co th.l{text-align:left}
.co td{font-size:17px;font-weight:800;text-align:right;padding:10px;border-bottom:1px solid #efeaf6;color:var(--ink)}
.co td.l{text-align:left;font-size:14px;color:#453f54;font-weight:700}.co td .d2{font-size:12px;color:var(--mut);font-weight:600}
.co td.mat{border-radius:6px}
table.hm{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
.hm th{color:var(--acc);font-weight:700;padding:5px 6px;text-align:center}.hm th.hr{text-align:right}
.hm td{text-align:center;font-weight:700;padding:5px 4px;border:1px solid #efeaf6;color:#2a2438}
.hm td.hr{color:var(--acc);text-align:right;padding-right:10px}.hm td.tot,.hm th.tot{font-weight:800;background:#f3eefb}
.hide{display:none}.err{color:var(--red);font-weight:600;padding:20px}
</style></head><body>
<header><div><div class=lbl>WIOM · Minimum Guarantee Program</div><h1>Funnels &amp; Leading Metrics</h1></div>
<div class=asof id=asof>loading…</div></header>
<div class=tabs><button class="tab on" data-t=fn>Booking → Install Funnel</button><button class=tab data-t=co>Daily cohorts (D-1→D-14)</button><button class=tab data-t=tr>Trends</button><button class=tab data-t=in>Installs · Hourly</button></div>
<div id=fn></div><div id=co class=hide></div><div id=tr class=hide></div><div id=in class=hide></div>
<script>
var API='https://web-production-9f444.up.railway.app/data2';
function n(v){return v==null?'—':Number(v).toLocaleString('en-IN');}
function ft(m){if(m==null)return '—';return m<120?Math.round(m)+'m':(m/60).toFixed(1)+'h';}
var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fw(w){if(!w)return '—';function p(x){var a=x.split('-');return{d:+a[2],m:MO[+a[1]-1]};}var a=p(w[0]),b=p(w[1]);return a.m===b.m?(a.d+'–'+b.d+' '+b.m):(a.d+' '+a.m+'–'+b.d+' '+b.m);}
function delta(pre,post,good){if(pre==null||post==null||!pre)return '<span class=flat>—</span>';var pc=Math.round((post-pre)/Math.abs(pre)*100);var up=good==='up'?pc>0:pc<0;return '<span class="delta '+(pc===0?'flat':(up?'up':'dn'))+'">'+(pc>0?'+':'')+pc+'%</span>';}
function cel(num,pct,cls){return '<td class='+cls+'>'+n(num)+(pct!=null?' <span class=pc>'+pct+'%</span>':'')+'</td>';}
function frow(lab,PE,QE,QN,nk,pk,good){good=good||'up';return '<tr><td class=l>'+lab+'</td>'+cel(PE[nk],pk?PE[pk]:null,'pre')+cel(QE[nk],pk?QE[pk]:null,'post')+'<td>'+delta(PE[nk],QE[nk],good)+'</td>'+cel(QN[nk],pk?QN[pk]:null,'non')+'</tr>';}
function trow(lab,PE,QE,QN,k){return '<tr class=tat><td class=l>'+lab+'</td><td class=pre>'+ft(PE[k])+'</td><td class=post>'+ft(QE[k])+'</td><td>'+delta(PE[k],QE[k],'down')+'</td><td class=non>'+ft(QN[k])+'</td></tr>';}
function trend(D){var B=D.bookings_daily||[],I=D.installs_daily||[];var m={};B.forEach(function(x){(m[x.d]=m[x.d]||{}).b=x.r;});I.forEach(function(x){(m[x.d]=m[x.d]||{}).i=x.e;});
 var days=Object.keys(m).sort();if(!days.length)return '<div class=card>No trend data yet.</div>';
 var W=Math.max(560,days.length*74),Hh=230,pad=36,gap=(W-2*pad)/days.length,mx=0;days.forEach(function(d){mx=Math.max(mx,m[d].b||0,m[d].i||0);});mx=mx||1;
 var top=30,base=Hh-32,sc=function(v){return base-(v/mx)*(base-top);},bw=Math.min(42,gap*0.5),bars='',ln='',dots='',labs='';
 days.forEach(function(d,i){var cx=pad+(i+0.5)*gap,b=m[d].b||0,inst=m[d].i||0,by=sc(b);
  bars+='<rect x="'+(cx-bw/2)+'" y="'+by+'" width="'+bw+'" height="'+(base-by)+'" rx="3" fill="#c9a5f5"/>';
  labs+='<text x="'+cx+'" y="'+(by-6)+'" text-anchor="middle" fill="#6d17ce" font-size="12.5" font-weight="800">'+b+'</text>';
  labs+='<text x="'+cx+'" y="'+(base+18)+'" text-anchor="middle" fill="#665e75" font-size="12">'+d+'</text>';
  var iy=sc(inst);ln+=(i?'L':'M')+cx+' '+iy+' ';dots+='<circle cx="'+cx+'" cy="'+iy+'" r="4" fill="#d9008d"/>';
  labs+='<text x="'+cx+'" y="'+(iy-9)+'" text-anchor="middle" fill="#d9008d" font-size="12" font-weight="800">'+inst+'</text>';});
 return '<div class=card><h2>Daily trend · since 1 Jul</h2><div class=sub><span style="color:#c9a5f5">&#9646;</span> bookings received / day &nbsp;&nbsp; <span style="color:#d9008d">&#8212;&#9679;</span> installs / day (enrolled)</div><div style="overflow:auto"><svg viewBox="0 0 '+W+' '+Hh+'" style="width:100%;max-width:'+W+'px;height:auto">'+bars+'<path d="'+ln+'" fill="none" stroke="#d9008d" stroke-width="2.5"/>'+dots+labs+'</svg></div></div>';}
function render(D){
 var QE=(D.POST||{}).enr||{},PE=(D.PRE||{}).enr||{},QN=(D.POST||{}).non||{};
 document.getElementById('asof').textContent='live · PRE '+fw(D.pre_window)+' vs POST '+fw(D.post_window)+' ('+D.n_days+'d each) · '+n(D.num_csps)+' enrolled CSPs · updated '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
 var t='<div class=card><h2>Booking → Install funnel · enrolled vs non-enrolled</h2><div class=sub>per-day numbers · <b>%</b> = share of bookings received (top-down funnel) · PRE = same '+D.n_days+' days before launch</div>'+
  '<table class=ft><thead><tr><th class=l>Stage / day</th><th>Enrolled PRE</th><th>Enrolled POST</th><th>Δ vol</th><th>Non-enr POST</th></tr></thead><tbody>'+
  frow('Bookings received',PE,QE,QN,'received_d',null)+
  '<tr class=sub><td class=l>&nbsp;&nbsp;&#8627; per CSP / day</td><td class=pre>'+(PE.per_csp_d||'—')+'</td><td>'+(QE.per_csp_d||'—')+'</td><td></td><td>'+(QN.per_csp_d||'—')+'</td></tr>'+
  frow('CSP accepted / slot proposed',PE,QE,QN,'slot_d','slot_pct')+
  frow('Slot confirmed by customer',PE,QE,QN,'confirm_d','confirm_pct')+
  frow('Technician assigned',PE,QE,QN,'assign_d','assign_pct')+
  frow('Installed',PE,QE,QN,'install_d','install_pct')+
  trow('Task created → slot proposed',PE,QE,QN,'tat_task_slot')+
  trow('Slot proposed → customer confirmed',PE,QE,QN,'tat_slot_confirm')+
  trow('Customer confirmed → installed',PE,QE,QN,'tat_confirm_install')+
  '</tbody></table><div class=note>TATs = median stage-to-stage durations. There is no separate "technician assigned" timestamp in the data, so that step has no isolated TAT — it sits inside "confirmed → installed".</div></div>'+trend(D);
 document.getElementById('fn').innerHTML=t;
 var C=D.cohorts||[];var ct='<div class=card><h2>Daily cohorts · funnel by booking-day maturity</h2><div class=sub>each row = bookings received that day &amp; how far they&#39;ve progressed <b>as of now</b> · % of that day&#39;s bookings</div>'+
  '<table class=co><thead><tr><th class=l>Cohort</th><th>Bookings</th><th>Accepted</th><th>Confirmed</th><th>Assigned</th><th>Installed</th></tr></thead><tbody>';
 C.forEach(function(c){var lag=c.lag,tag=lag<=2?' &#183; fresh':(lag>=7?' &#183; matured':'');
  var op=Math.min(1,c.install_pct/45),ic='rgba(0,128,67,'+(0.10+0.5*op).toFixed(2)+')';
  ct+='<tr><td class=l>D-'+lag+' <span class=d2>('+c.date+')'+tag+'</span></td><td>'+n(c.recv)+'</td><td>'+c.slot_pct+'%</td><td>'+c.confirm_pct+'%</td><td>'+c.assign_pct+'%</td><td class=mat style="background:'+ic+'">'+c.install_pct+'%</td></tr>';});
 ct+='</tbody></table><div class=note><b>Read this for maturity, not performance.</b> Recent cohorts (D-1/D-2) are still in-flight — their install % is low simply because their bookings haven&#39;t had time to install yet. Compare same-age cohorts (e.g. D-7 vs D-14) to judge real conversion. Enrolled MG CSPs only.</div></div>';
 document.getElementById('co').innerHTML=ct;
 document.getElementById('tr').innerHTML=trend(D);
 var H=D.hourly_installs||[];
 if(!H.length){document.getElementById('in').innerHTML='<div class=card>No install data yet.</div>';}
 else{var days=Array.from(new Set(H.map(function(x){return x.d;}))).sort(),key={},mx=0,tot=0;H.forEach(function(x){key[x.hr+'|'+x.d]=x.e;if(x.e>mx)mx=x.e;tot+=x.e;});
  var hrs=H.map(function(x){return x.hr;}),hmin=Math.min.apply(null,hrs),hmax=Math.max.apply(null,hrs),hours=[];for(var h=hmin;h<=hmax;h++)hours.push(h);var dt={};days.forEach(function(dd){dt[dd]=0;});
  var s='<div class=card><h2>Installs by hour × day</h2><div class=sub>'+tot+' installs this month · enrolled MG CSPs · darker = more</div><div style="overflow:auto"><table class=hm><thead><tr><th class=hr>Hour</th>'+days.map(function(dd){return '<th>'+dd.slice(5)+'</th>';}).join('')+'<th class=tot>Total</th></tr></thead><tbody>';
  hours.forEach(function(h){var rt=0;s+='<tr><td class=hr>'+h+':00</td>';days.forEach(function(dd){var v=key[h+'|'+dd]||0;rt+=v;dt[dd]+=v;var op=mx?(0.08+0.92*v/mx):0;s+='<td style="background:'+(v?'rgba(139,92,246,'+op.toFixed(2)+')':'transparent')+';color:'+(op>.55?'#fff':'#2a2438')+'">'+(v||'')+'</td>';});s+='<td class=tot>'+rt+'</td></tr>';});
  s+='<tr><td class=hr style="color:#2a2438">Total</td>'+days.map(function(dd){return '<td class=tot>'+dt[dd]+'</td>';}).join('')+'<td class=tot>'+tot+'</td></tr></tbody></table></div></div>';document.getElementById('in').innerHTML=s;}
}
function boot(){fetch(API,{cache:'no-store'}).then(function(r){return r.json();}).then(function(dd){if(dd&&dd.funnel&&dd.funnel.POST)render(dd.funnel);else document.getElementById('asof').textContent='data warming up…';}).catch(function(e){document.getElementById('fn').innerHTML='<div class="card err">Could not reach live data ('+e+'). Retrying…</div>';});}
boot();setInterval(boot,120000);
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});b.classList.add('on');['fn','co','tr','in'].forEach(function(id){document.getElementById(id).classList.toggle('hide',id!==b.dataset.t);});};});
</script></body></html>
