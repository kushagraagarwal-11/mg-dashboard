<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1"><title>MG Program — Funnels & Metrics</title>
<style>
:root{--bg:#eceef3;--card:#fff;--ink:#0d1117;--sub:#5a6472;--faint:#8a92a1;--line:#e6e8ee;--line2:#eef0f4;
--acc:#4f46e5;--acc2:#7c3aed;--pos:#06874e;--neg:#d92d20;--warm:#b45309;--head:#12141c}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);
-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv05" 1;padding:26px 22px 50px;max-width:1180px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:5px}
h1{font-size:clamp(1.5rem,3vw,2.15rem);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.asof{font-size:12.5px;color:var(--sub);text-align:right;line-height:1.7;padding-top:4px}
.asof b{color:var(--ink);font-weight:700}
.tabs{display:inline-flex;gap:2px;background:#e0e3ea;padding:3px;border-radius:11px;margin-bottom:22px;flex-wrap:wrap}
.tab{border:none;background:transparent;color:var(--sub);border-radius:8px;padding:8px 17px;font-size:13.5px;font-weight:650;cursor:pointer;transition:.12s;white-space:nowrap}
.tab:hover{color:var(--ink)}.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(13,17,23,.12),0 0 0 .5px rgba(13,17,23,.04)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(13,17,23,.04),0 8px 28px -18px rgba(13,17,23,.22);padding:22px 24px;margin-bottom:16px}
.ch2{font-size:15px;font-weight:750;letter-spacing:-.01em}.csub{font-size:12.5px;color:var(--sub);margin-top:2px;margin-bottom:16px}
.csub b{color:var(--ink)}
/* visual funnel */
.fnl{display:flex;flex-direction:column;gap:7px;margin:2px 0 4px}
.fbar{position:relative;height:34px;border-radius:7px;background:var(--line2);overflow:hidden}
.ffill{position:absolute;inset:0 auto 0 0;border-radius:7px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.frow{position:relative;display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 13px;font-size:13px}
.frow .fn{font-weight:650;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.18);z-index:1;letter-spacing:-.01em}
.frow .fv{z-index:1;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.18)}
.frow .fv .fp{font-size:15px}.frow .fv .fa{font-size:11.5px;opacity:.82;margin-left:6px;font-weight:600}
/* comparison table */
table.t{border-collapse:collapse;width:100%}
.t thead th{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:right;padding:0 12px 9px;border-bottom:1px solid var(--line)}
.t thead th.l{text-align:left}
.t td{padding:11px 12px;border-bottom:1px solid var(--line2);text-align:right;vertical-align:middle}
.t tr:last-child td{border-bottom:none}
.t td.l{text-align:left;font-size:13.5px;color:#39414f;font-weight:600}
.t td .p{font-size:18px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.t td .a{font-size:11.5px;color:var(--faint);font-weight:600;margin-left:5px}
.t td.pre .p{color:#8a90a0}.t td.pre .a{color:#aeb4c0}
.t td.non .p{font-size:15px;color:var(--sub)}.t td.non .a{color:#aeb4c0}
.t tr.div td{border-top:1px solid var(--line);padding-top:13px}
.t tr.tat td{color:var(--sub)}.t tr.tat td.l{color:#5a6472;font-weight:600}.t tr.tat td .p{font-size:15px;font-weight:750;color:#39414f}
.dl{font-size:11.5px;font-weight:750;display:inline-flex;align-items:center;gap:2px}.up{color:var(--pos)}.dn{color:var(--neg)}.fl{color:var(--faint)}
.note{font-size:11.5px;color:var(--sub);margin-top:14px;line-height:1.6;padding-top:13px;border-top:1px solid var(--line2)}
/* cohorts */
.t.co td .p{font-size:16px}.t.co td.l .sm{font-size:11px;color:var(--faint);font-weight:600;margin-left:4px}
.heat{display:inline-block;min-width:52px;padding:3px 9px;border-radius:6px;font-weight:800;font-size:15px}
/* charts */
.chart{width:100%;overflow:hidden}svg{display:block;width:100%;height:auto}
.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin-bottom:6px}
.lgd span{display:inline-flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
/* heatmap */
table.hm{border-collapse:collapse;width:100%;font-size:12.5px}
.hm th{color:var(--sub);font-weight:650;padding:5px 6px;text-align:center;font-size:11px}.hm th.hr{text-align:right}
.hm td{text-align:center;font-weight:700;padding:5px 4px;color:#2a2f3a}
.hm td.hr{color:var(--faint);text-align:right;padding-right:11px;font-weight:600}
.hm td.tot,.hm th.tot{font-weight:800;color:var(--ink)}.hm tr.totr td{border-top:1px solid var(--line);padding-top:7px}
.hide{display:none}.err{color:var(--neg);font-weight:600;padding:22px}
.soon{border:1px dashed var(--line);background:transparent;box-shadow:none;text-align:center;padding:34px;color:var(--sub)}
.soon b{color:var(--ink)}
</style></head><body>
<div class=top><div><div class=eyebrow>WIOM · Minimum Guarantee Program</div><h1>Funnels &amp; Leading Metrics</h1></div>
<div class=asof id=asof>loading…</div></div>
<div class=tabs><button class="tab on" data-t=fn>Funnel</button><button class=tab data-t=co>Daily cohorts</button><button class=tab data-t=tr>Trends</button><button class=tab data-t=sg>By segment</button><button class=tab data-t=in>Installs</button></div>
<div id=fn></div><div id=co class=hide></div><div id=tr class=hide></div><div id=sg class=hide></div><div id=in class=hide></div>
<script>
var API='https://web-production-9f444.up.railway.app/data2';
function n(v){return v==null?'—':Number(v).toLocaleString('en-IN');}
function ft(m){if(m==null||m==='—')return '—';return m<90?Math.round(m)+'m':(m/60).toFixed(1)+'h';}
var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fw(w){if(!w)return '—';function p(x){var a=x.split('-');return{d:+a[2],m:MO[+a[1]-1]};}var a=p(w[0]),b=p(w[1]);return a.m===b.m?(a.d+'–'+b.d+' '+b.m):(a.d+' '+a.m+'–'+b.d+' '+b.m);}
function dl(pre,post,good){if(pre==null||post==null||!pre)return '<span class="dl fl">—</span>';var pc=Math.round((post-pre)/Math.abs(pre)*100);if(pc===0)return '<span class="dl fl">0%</span>';var up=good==='up'?pc>0:pc<0;return '<span class="dl '+(up?'up':'dn')+'">'+(pc>0?'▲':'▼')+Math.abs(pc)+'%</span>';}
function cP(pct,abs,cls){cls=cls||'post';if(pct==null)return '<td class='+cls+'><span class=p>'+n(abs)+'</span></td>';return '<td class='+cls+'><span class=p>'+pct+'%</span><span class=a>'+n(abs)+'</span></td>';}
function pctRow(lab,PE,QE,QN,pk,ak,good){good=good||'up';return '<tr><td class=l>'+lab+'</td>'+cP(PE[pk],PE[ak],'pre')+cP(QE[pk],QE[ak],'post')+'<td>'+dl(PE[pk],QE[pk],good)+'</td>'+cP(QN[pk],QN[ak],'non')+'</tr>';}
function tatRow(lab,PE,QE,QN,k){return '<tr class=tat><td class=l>'+lab+'</td><td class=pre><span class=p>'+ft(PE[k])+'</span></td><td class=post><span class=p>'+ft(QE[k])+'</span></td><td>'+dl(PE[k],QE[k],'down')+'</td><td class=non><span class=p>'+ft(QN[k])+'</span></td></tr>';}

// ---- multi-series line chart (sharp) ----
function lineChart(days,series,fmt,unitLine){
 var W=760,H=250,padL=44,padR=14,padT=18,padB=30,iw=W-padL-padR,ih=H-padT-padB;
 var mx=0;series.forEach(function(s){s.v.forEach(function(y){if(y!=null&&y>mx)mx=y;});});mx=mx*1.12||1;
 var x=function(i){return padL+(days.length<2?iw/2:iw*i/(days.length-1));},y=function(v){return padT+ih-(v/mx)*ih;};
 var g='';for(var k=0;k<=4;k++){var gv=mx*k/4,gy=padT+ih-(k/4)*ih;g+='<line x1='+padL+' y1='+gy.toFixed(1)+' x2='+(W-padR)+' y2='+gy.toFixed(1)+' stroke="#eef0f4"/>'+'<text x='+(padL-8)+' y='+(gy+4).toFixed(1)+' text-anchor=end fill="#8a92a1" font-size=10.5>'+fmt(gv)+'</text>';}
 var xl='';days.forEach(function(d,i){xl+='<text x='+x(i).toFixed(1)+' y='+(H-9)+' text-anchor=middle fill="#8a92a1" font-size=10.5>'+d+'</text>';});
 var paths='';series.forEach(function(s){var p='',dots='';s.v.forEach(function(v,i){if(v==null)return;p+=(p?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';dots+='<circle cx='+x(i).toFixed(1)+' cy='+y(v).toFixed(1)+' r=3 fill="'+s.c+'"/>';});paths+='<path d="'+p+'" fill=none stroke="'+s.c+'" stroke-width=2.2 stroke-linejoin=round stroke-linecap=round/>'+dots;});
 var lg='<div class=lgd>'+series.map(function(s){return '<span><span class=dot style="background:'+s.c+'"></span>'+s.n+'</span>';}).join('')+'</div>';
 return lg+'<div class=chart><svg viewBox="0 0 '+W+' '+H+'">'+g+paths+xl+'</svg></div>';
}
function barLine(days,bars,line){
 var W=760,H=250,padL=40,padR=14,padT=20,padB=30,iw=W-padL-padR,ih=H-padT-padB,gap=iw/days.length;
 var mx=0;bars.forEach(function(v){if(v>mx)mx=v;});line.forEach(function(v){if(v>mx)mx=v;});mx=mx*1.14||1;
 var y=function(v){return padT+ih-(v/mx)*ih;},bw=Math.min(46,gap*.52),s='';
 days.forEach(function(d,i){var cx=padL+(i+.5)*gap,by=y(bars[i]);
  s+='<rect x='+(cx-bw/2).toFixed(1)+' y='+by.toFixed(1)+' width='+bw.toFixed(1)+' height='+(padT+ih-by).toFixed(1)+' rx=4 fill="#c7c3f5"/>';
  s+='<text x='+cx.toFixed(1)+' y='+(by-6).toFixed(1)+' text-anchor=middle fill="#4f46e5" font-size=11.5 font-weight=800>'+bars[i]+'</text>';
  s+='<text x='+cx.toFixed(1)+' y='+(H-9)+' text-anchor=middle fill="#8a92a1" font-size=10.5>'+d+'</text>';});
 var p='',dots='';line.forEach(function(v,i){var cx=padL+(i+.5)*gap,ly=y(v);p+=(i?'L':'M')+cx.toFixed(1)+' '+ly.toFixed(1)+' ';dots+='<circle cx='+cx.toFixed(1)+' cy='+ly.toFixed(1)+' r=3.5 fill="#c026d3"/><text x='+cx.toFixed(1)+' y='+(ly-9).toFixed(1)+' text-anchor=middle fill="#c026d3" font-size=11 font-weight=800>'+v+'</text>';});
 return '<div class=lgd><span><span class=dot style="background:#c7c3f5"></span>Bookings received / day</span><span><span class=dot style="background:#c026d3"></span>Installs / day</span></div><div class=chart><svg viewBox="0 0 '+W+' '+H+'">'+s+'<path d="'+p+'" fill=none stroke="#c026d3" stroke-width=2.2/>'+dots+'</svg></div>';
}

function render(D){
 var QE=(D.POST||{}).enr||{},PE=(D.PRE||{}).enr||{},QN=(D.POST||{}).non||{};
 document.getElementById('asof').innerHTML='<b>Live</b> · auto-refresh 2 min · updated '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+'<br>PRE '+fw(D.pre_window)+' vs POST '+fw(D.post_window)+' · '+D.n_days+' days each<br>'+n(D.num_csps)+' enrolled MG CSPs';
 // ---- FUNNEL ----
 var stg=[['Bookings received',100,QE.received_d],['CSP accepted / slot proposed',QE.slot_pct,QE.slot_d],['Slot confirmed by customer',QE.confirm_pct,QE.confirm_d],['Technician assigned',QE.assign_pct,QE.assign_d],['Installed',QE.install_pct,QE.install_d]];
 var vf='<div class=fnl>';stg.forEach(function(s){var w=Math.max(11,s[1]);vf+='<div class=fbar><div class=ffill style="width:'+w+'%"></div><div class=frow><span class=fn>'+s[0]+'</span><span class=fv><span class=fp>'+s[1]+'%</span><span class=fa>'+n(s[2])+'/day</span></span></div></div>';});vf+='</div>';
 var tbl='<table class=t><thead><tr><th class=l>Stage</th><th>Enrolled PRE</th><th>Enrolled POST</th><th>Δ vol</th><th>Non-enrolled</th></tr></thead><tbody>'+
  pctRow('Bookings received / day',PE,QE,QN,null,'received_d')+
  pctRow('CSP accepted / slot proposed',PE,QE,QN,'slot_pct','slot_d')+
  pctRow('Slot confirmed by customer',PE,QE,QN,'confirm_pct','confirm_d')+
  pctRow('Technician assigned',PE,QE,QN,'assign_pct','assign_d')+
  pctRow('Installed',PE,QE,QN,'install_pct','install_d')+
  '<tr class=div><td class=l>Install rate <span style="color:var(--faint);font-weight:600">(of confirmed)</span></td><td class=pre><span class=p>'+PE.install_ratio+'%</span></td><td class=post><span class=p>'+QE.install_ratio+'%</span></td><td>'+dl(PE.install_ratio,QE.install_ratio,'up')+'</td><td class=non><span class=p>'+QN.install_ratio+'%</span></td></tr>'+
  '<tr><td class=l>CSP decline rate <span style="color:var(--faint);font-weight:600">(of leads offered)</span></td><td class=pre><span class=p>'+PE.decline_pct+'%</span></td><td class=post><span class=p>'+QE.decline_pct+'%</span></td><td>'+dl(PE.decline_pct,QE.decline_pct,'down')+'</td><td class=non><span class=p>'+QN.decline_pct+'%</span></td></tr>'+
  tatRow('Task created → slot proposed',PE,QE,QN,'tat_task_slot')+
  tatRow('Slot proposed → customer confirmed',PE,QE,QN,'tat_slot_confirm')+
  tatRow('Customer confirmed → technician assigned',PE,QE,QN,'tat_confirm_assign')+
  tatRow('Technician assigned → installed',PE,QE,QN,'tat_assign_install')+
  '</tbody></table>';
 document.getElementById('fn').innerHTML='<div class=card><div class=ch2>Booking → Install funnel</div><div class=csub>Enrolled MG CSPs, POST window · <b>%</b> = share of bookings received</div>'+vf+'</div>'+
  '<div class=card><div class=ch2>Stage detail · enrolled PRE vs POST vs non-enrolled</div><div class=csub>Big number = % (of bookings received) · small = per-day volume</div>'+tbl+
  '<div class=note>Two install figures, both correct: <b>26%</b> = installed ÷ bookings received (funnel position); <b>'+QE.install_ratio+'%</b> = installed ÷ confirmed (install-rate KPI). TATs are median stage-to-stage from the connection state history. Decline = share of leads offered to a CSP that the CSP declined (counted across all offers, since a decline re-allocates).</div></div>';
 // ---- COHORTS ----
 var C=D.cohorts||[];var ct='<table class="t co"><thead><tr><th class=l>Cohort (booking day)</th><th>Bookings</th><th>Accepted</th><th>Confirmed</th><th>Assigned</th><th>Installed</th></tr></thead><tbody>';
 C.forEach(function(c){var tag=c.lag<=2?'fresh':(c.lag>=7?'matured':'');var op=Math.min(1,c.install_pct/45),bg='rgba(6,135,78,'+(0.08+0.42*op).toFixed(2)+')';
  ct+='<tr><td class=l>D-'+c.lag+' <span class=sm>'+c.date+(tag?' · '+tag:'')+'</span></td><td><span class=p>'+n(c.recv)+'</span></td><td><span class=p>'+c.slot_pct+'%</span></td><td><span class=p>'+c.confirm_pct+'%</span></td><td><span class=p>'+c.assign_pct+'%</span></td><td><span class=heat style="background:'+bg+'">'+c.install_pct+'%</span></td></tr>';});
 ct+='</tbody></table>';
 document.getElementById('co').innerHTML='<div class=card><div class=ch2>Daily cohorts · funnel by booking-day maturity</div><div class=csub>Each row = bookings received that day &amp; how far they&#39;ve progressed <b>as of now</b> (% of that day&#39;s bookings)</div>'+ct+
  '<div class=note><b>Read for maturity, not performance.</b> Recent cohorts (D-1/D-2) are still in-flight — low install % just means their bookings haven&#39;t had time to install yet. Compare same-age cohorts (D-7 vs D-14) for real conversion.</div></div>';
 // ---- TRENDS ----
 var dd=D.daily||[];var days=dd.map(function(x){return x.d;});
 if(!dd.length){document.getElementById('tr').innerHTML='<div class=card>No trend data yet.</div>';}
 else{
  var vol=barLine(days,dd.map(function(x){return x.recv;}),dd.map(function(x){var i=D.installs_daily.find(function(z){return z.d===x.d;});return i?i.e:0;}));
  var conv=lineChart(days,[{n:'Accepted',c:'#4f46e5',v:dd.map(function(x){return Math.round(100*x.slot/(x.recv||1));})},{n:'Confirmed',c:'#7c3aed',v:dd.map(function(x){return Math.round(100*x.confirm/(x.recv||1));})},{n:'Assigned',c:'#c026d3',v:dd.map(function(x){return Math.round(100*x.assign/(x.recv||1));})},{n:'Installed',c:'#06874e',v:dd.map(function(x){return Math.round(100*x.install/(x.recv||1));})}],function(v){return Math.round(v)+'%';});
  var tat=lineChart(days,[{n:'Task→slot',c:'#4f46e5',v:dd.map(function(x){return x.t_ts;})},{n:'Slot→confirm',c:'#7c3aed',v:dd.map(function(x){return x.t_sc;})},{n:'Confirm→assign',c:'#c026d3',v:dd.map(function(x){return x.t_ca;})},{n:'Assign→install',c:'#06874e',v:dd.map(function(x){return x.t_ai;})}],function(v){return ft(v);});
  document.getElementById('tr').innerHTML='<div class=card><div class=ch2>Volume · bookings &amp; installs per day</div><div class=csub>Enrolled MG CSPs · since 1 Jul</div>'+vol+'</div>'+
   '<div class=card><div class=ch2>Stage conversion trend</div><div class=csub>Each stage as % of that day&#39;s bookings received</div>'+conv+'</div>'+
   '<div class=card><div class=ch2>Turnaround (TAT) trend</div><div class=csub>Median stage-to-stage duration per booking-day</div>'+tat+'</div>';
 }
 // ---- BY SEGMENT (placeholder) ----
 document.getElementById('sg').innerHTML='<div class="card soon"><div class=ch2 style="margin-bottom:6px">By segment · keepgoing / almost / secured</div>Per-screen view — targeted CSPs, banner views &amp; booking→install funnel for each MG status — is being wired in next.<br><b>Coming shortly.</b></div>';
 // ---- INSTALLS ----
 var H=D.hourly_installs||[];
 if(!H.length){document.getElementById('in').innerHTML='<div class=card>No install data yet.</div>';}
 else{var days2=Array.from(new Set(H.map(function(x){return x.d;}))).sort(),key={},mx=0,tot=0;H.forEach(function(x){key[x.hr+'|'+x.d]=x.e;if(x.e>mx)mx=x.e;tot+=x.e;});
  var hrs=H.map(function(x){return x.hr;}),hmin=Math.min.apply(null,hrs),hmax=Math.max.apply(null,hrs),hours=[];for(var h=hmin;h<=hmax;h++)hours.push(h);var dt={};days2.forEach(function(dd2){dt[dd2]=0;});
  var s='<div class=card><div class=ch2>Installs by hour × day</div><div class=csub><b>'+tot+'</b> installs this month · enrolled MG CSPs · darker = more</div><div style="overflow:auto"><table class=hm><thead><tr><th class=hr>Hour</th>'+days2.map(function(dd2){return '<th>'+dd2.slice(5)+'</th>';}).join('')+'<th class=tot>Total</th></tr></thead><tbody>';
  hours.forEach(function(h){var rt=0;s+='<tr><td class=hr>'+h+':00</td>';days2.forEach(function(dd2){var v=key[h+'|'+dd2]||0;rt+=v;dt[dd2]+=v;var op=mx?v/mx:0;s+='<td style="background:'+(v?'rgba(79,70,229,'+(0.08+0.82*op).toFixed(2)+')':'transparent')+';color:'+(op>.5?'#fff':'#2a2f3a')+'">'+(v||'')+'</td>';});s+='<td class=tot>'+rt+'</td></tr>';});
  s+='<tr class=totr><td class=hr style="color:var(--ink);font-weight:800">Total</td>'+days2.map(function(dd2){return '<td class=tot>'+dt[dd2]+'</td>';}).join('')+'<td class=tot>'+tot+'</td></tr></tbody></table></div></div>';document.getElementById('in').innerHTML=s;}
}
function boot(){fetch(API,{cache:'no-store'}).then(function(r){return r.json();}).then(function(dd){if(dd&&dd.funnel&&dd.funnel.POST)render(dd.funnel);else document.getElementById('asof').textContent='data warming up…';}).catch(function(e){document.getElementById('fn').innerHTML='<div class="card err">Could not reach live data ('+e+'). Retrying…</div>';});}
boot();setInterval(boot,120000);
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});b.classList.add('on');['fn','co','tr','sg','in'].forEach(function(id){document.getElementById(id).classList.toggle('hide',id!==b.dataset.t);});};});
</script></body></html>
