<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1"><title>MG Program — Funnels & Metrics</title>
<style>
:root{--acc:#6d17ce;--acc2:#a855f7;--pink:#d9008d;--bg:#f1edf7;--card:#faf9fc;--ink:#161021;--mut:#665e75;--green:#008043;--red:#e01e00}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:22px;max-width:1280px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:clamp(1.4rem,3vw,2rem);font-weight:800;line-height:1.15}
.lbl{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut)}
.asof{font-size:13px;color:var(--mut)}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tab{border:none;background:var(--card);color:var(--mut);border-radius:40px;padding:9px 24px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 3px 16px rgba(22,16,33,.06)}
.tab.on{background:var(--ink);color:#fff}
.card{background:var(--card);border-radius:16px;box-shadow:0 4px 24px rgba(22,16,33,.06);padding:22px 26px;margin-bottom:18px}
.card h2{font-size:1.05rem;font-weight:800;margin-bottom:3px}.card .sub{font-size:13px;color:var(--mut);margin-bottom:14px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px}
.kpi .v{font-size:2.4rem;font-weight:800;line-height:1;color:var(--acc)}.kpi .d{font-size:12px;color:var(--mut);margin-top:4px}
.kpi .delta{font-size:13px;font-weight:800;margin-left:6px}.up{color:var(--green)}.dn{color:var(--red)}
.tri{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0}
.stg{width:100%;max-width:900px;display:flex;flex-direction:column;align-items:center}
.snm{font-size:14px;font-weight:700;color:#4a4358;margin-bottom:5px}
.sbar{height:64px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:20px;background:linear-gradient(90deg,var(--acc),var(--acc2));box-shadow:0 4px 18px rgba(109,23,206,.22);min-width:120px}
.sbar .big{font-size:1.9rem;font-weight:900;color:#fff}.sbar .pct{font-size:1.15rem;font-weight:800;color:#eddbff}
.scmp{display:flex;gap:22px;font-size:12.5px;color:var(--mut);margin-top:6px}.scmp b{color:#3a3448;font-weight:800}.scmp .tat b{color:#8a5a00}
table.hm{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
.hm th{color:var(--acc);font-weight:700;padding:5px 6px;text-align:center}.hm th.hr{text-align:right}
.hm td{text-align:center;font-weight:700;padding:5px 4px;border:1px solid #efeaf6;color:#2a2438}
.hm td.hr{color:var(--acc);text-align:right;padding-right:10px}.hm td.tot,.hm th.tot{font-weight:800;background:#f3eefb}
.hide{display:none}.err{color:var(--red);font-weight:600;padding:20px}
</style></head><body>
<header><div><div class=lbl>WIOM · Minimum Guarantee Program</div><h1>Funnels &amp; Leading Metrics</h1></div>
<div class=asof id=asof>loading…</div></header>
<div class=tabs><button class="tab on" data-t=ov>Overview</button><button class=tab data-t=fn>Booking → Install Funnel</button><button class=tab data-t=in>Installs · Hourly</button></div>
<div id=ov></div><div id=fn class=hide></div><div id=in class=hide></div>
<script>
var API='https://web-production-9f444.up.railway.app/data2';
function n(v){return v==null?'—':Number(v).toLocaleString('en-IN');}
function ft(m){if(m==null)return '—';return m<120?Math.round(m)+'m':(m/60).toFixed(1)+'h';}
var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fw(w){if(!w)return '—';function p(x){var a=x.split('-');return{d:+a[2],m:MO[+a[1]-1]};}var a=p(w[0]),b=p(w[1]);return a.m===b.m?(a.d+'–'+b.d+' '+b.m):(a.d+' '+a.m+'–'+b.d+' '+b.m);}
function delta(pre,post,good){if(pre==null||post==null||!pre)return '';var pc=Math.round((post-pre)/Math.abs(pre)*100);var up=good==='up'?pc>0:pc<0;return '<span class="delta '+(up?'up':'dn')+'">'+(pc>0?'+':'')+pc+'%</span>';}
function kpi(post,pre,good,lab,suf){suf=suf||'';return '<div class=kpi><div class=v>'+n(post)+suf+(pre!=null?delta(pre,post,good):'')+'</div><div class=d>'+lab+(pre!=null?' · PRE '+n(pre)+suf:'')+'</div></div>';}
function render(D){
 var QE=(D.POST||{}).enr||{},PE=(D.PRE||{}).enr||{},QN=(D.POST||{}).non||{};
 document.getElementById('asof').textContent='live · PRE '+fw(D.pre_window)+' vs POST '+fw(D.post_window)+' ('+D.n_days+'d each) · updated '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
 document.getElementById('ov').innerHTML='<div class=card><div class=strip>'+
  kpi(QE.received_d,PE.received_d,'up','Bookings received / day')+kpi(QE.install_d,PE.install_d,'up','Installs / day')+
  kpi(QE.install_ratio,PE.install_ratio,'up','Install rate (of confirmed)','%')+kpi(QE.slot_pct,PE.slot_pct,'up','CSP accept & slot %','%')+
  kpi(QN.received_d,null,'up','Non-enrolled bookings / day')+
  '</div><div class=sub style="margin-top:14px">Enrolled MG CSPs · current position, no maturity cap · PRE = same '+D.n_days+' days before launch</div></div>';
 var recv=QE.received||1,S=[{n:'Bookings received',v:QE.received,pre:PE.received,non:QN.received,p:100,t:null},
  {n:'CSP accepted & proposed slot',v:QE.slot,pre:PE.slot,non:QN.slot,p:QE.slot_pct,t:QE.tat_slot},
  {n:'Customer confirmed slot',v:QE.confirm,pre:PE.confirm,non:QN.confirm,p:QE.confirm_pct,t:QE.tat_confirm},
  {n:'Installed',v:QE.install,pre:PE.install,non:QN.install,p:QE.install_ratio,t:QE.tat_install}];
 var s='<div class=card><h2>Booking → Install funnel</h2><div class=sub>abs = POST total over '+D.n_days+' days · % = stage conversion · TAT = median booking→stage</div><div class=tri>';
 S.forEach(function(x,i){var w=Math.max(16,Math.round(100*(x.v||0)/recv));s+='<div class=stg><div class=snm>'+x.n+'</div><div class=sbar style="width:'+w+'%"><span class=big>'+n(x.v)+'</span>'+(i>0?'<span class=pct>'+x.p+'%</span>':'')+'</div><div class=scmp><span>PRE <b>'+n(x.pre)+'</b></span><span>Non-enrolled <b>'+n(x.non)+'</b></span>'+(x.t!=null?'<span class=tat>booking→here <b>'+ft(x.t)+'</b></span>':'')+'</div></div>';});
 s+='</div></div>';document.getElementById('fn').innerHTML=s;
 var H=D.hourly_installs||[];
 if(!H.length){document.getElementById('in').innerHTML='<div class=card>No install data yet.</div>';}
 else{var days=Array.from(new Set(H.map(function(x){return x.d;}))).sort(),key={},mx=0,tot=0;H.forEach(function(x){key[x.hr+'|'+x.d]=x.e;if(x.e>mx)mx=x.e;tot+=x.e;});
  var hrs=H.map(function(x){return x.hr;}),hmin=Math.min.apply(null,hrs),hmax=Math.max.apply(null,hrs),hours=[];for(var h=hmin;h<=hmax;h++)hours.push(h);var dt={};days.forEach(function(dd){dt[dd]=0;});
  var t='<div class=card><h2>Installs by hour × day</h2><div class=sub>'+tot+' installs this month · enrolled MG CSPs · darker = more</div><div style="overflow:auto"><table class=hm><thead><tr><th class=hr>Hour</th>'+days.map(function(dd){return '<th>'+dd.slice(5)+'</th>';}).join('')+'<th class=tot>Total</th></tr></thead><tbody>';
  hours.forEach(function(h){var rt=0;t+='<tr><td class=hr>'+h+':00</td>';days.forEach(function(dd){var v=key[h+'|'+dd]||0;rt+=v;dt[dd]+=v;var op=mx?(0.08+0.92*v/mx):0;t+='<td style="background:'+(v?'rgba(139,92,246,'+op.toFixed(2)+')':'transparent')+';color:'+(op>.55?'#fff':'#2a2438')+'">'+(v||'')+'</td>';});t+='<td class=tot>'+rt+'</td></tr>';});
  t+='<tr><td class=hr style="color:#2a2438">Total</td>'+days.map(function(dd){return '<td class=tot>'+dt[dd]+'</td>';}).join('')+'<td class=tot>'+tot+'</td></tr></tbody></table></div></div>';document.getElementById('in').innerHTML=t;}
}
function boot(){fetch(API,{cache:'no-store'}).then(function(r){return r.json();}).then(function(dd){if(dd&&dd.funnel&&dd.funnel.POST)render(dd.funnel);else document.getElementById('asof').textContent='data warming up…';}).catch(function(e){document.getElementById('ov').innerHTML='<div class="card err">Could not reach live data ('+e+'). Retrying…</div>';});}
boot();setInterval(boot,120000);
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});b.classList.add('on');['ov','fn','in'].forEach(function(id){document.getElementById(id).classList.toggle('hide',id!==b.dataset.t);});};});
</script></body></html>
